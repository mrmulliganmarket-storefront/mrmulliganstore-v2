        <div id="modal-body"></div>

<script>
const DB_URL = "http://localhost:8080/api/turso";

// Hardcoded credentials - CHANGE THESE in production!
const ADMIN_USER = "admin";
const ADMIN_PASS = "mulligan2024";

function isAuthenticated() {
    return localStorage.getItem('adminAuth') === 'true';
}

function showLogin() {
    document.getElementById('login-overlay').classList.remove('hidden');
    document.querySelector('.main').classList.add('hidden');
}

function hideLogin() {
    document.getElementById('login-overlay').classList.add('hidden');
    document.querySelector('.main').classList.remove('hidden');
}

function login(e) {
    e.preventDefault();
    const user = document.getElementById('admin-username').value;
    const pass = document.getElementById('admin-password').value;
    const errorEl = document.getElementById('login-error');
    
    if (user === ADMIN_USER && pass === ADMIN_PASS) {
        localStorage.setItem('adminAuth', 'true');
        hideLogin();
        init();
    } else {
        errorEl.classList.remove('hidden');
        setTimeout(() => errorEl.classList.add('hidden'), 3000);
    }
    return false;
}

function logout() {
    localStorage.removeItem('adminAuth');
    location.reload();
}

function toast(msg) {
    const el = document.createElement('div');
    el.className = 'toast';
    el.textContent = msg;
    document.body.appendChild(el);
    setTimeout(function() { el.remove(); }, 3000);
}

function closeModal() { document.getElementById('modal').classList.remove('open'); document.getElementById('modal-body').innerHTML = ''; }
  function openModal(html) { document.getElementById('modal-body').innerHTML = html; document.getElementById('modal').classList.add('open'); }
 
 // Sparkline SVG helper
 function sparkline(data, color) {
     if (!data || !data.length) return '';
     const max = Math.max.apply(null, data.map(function(d) { return d.count || 0; }).concat([1]));
     const points = data.map(function(d, i) { return (i * 30) + ',' + (12 - (d.count / max * 12)); }).join(' ');
     return '<svg class="w-20 h-6" viewBox="0 0 120 12"><polyline points="' + points + '" fill="none" stroke="' + color + '" stroke-width="2"/></svg>';
 }
 
 // Date formatting helper - MM/DD/YY format
 function formatDate(dateStr) {
    if (!dateStr) return '';
    // Handle YYYY-MM-DD format by splitting to avoid timezone issues
    const parts = dateStr.split('-');
    if (parts.length === 3) {
        const year = parts[0].slice(-2);
        const month = parts[1];
        const day = parts[2];
        return month + '/' + day + '/' + year;
    }
    const d = new Date(dateStr);
    const month = String(d.getMonth() + 1).padStart(2, '0');
const day = String(d.getDate()).padStart(2, '0');
     const year = String(d.getFullYear()).slice(-2);
     return month + '/' + day + '/' + year;
 }
 
 async function dbQuery(sql, args=[], { timeout = 120000 } = {}) {
     const controller = new AbortController();
     const timer = setTimeout(function() { controller.abort(); }, timeout);
     const body = {
         requests: [{
             type: 'execute',
             stmt: {
                 sql: sql,
                 args: args.map(function(a) {
                 if (a === null || a === undefined) return { type: 'null', value: '' };
                 if (typeof a === 'number') return { type: 'float', value: a };
                 return { type: 'text', value: String(a) };
             })
             }
         }]
     };
     try {
         const res = await fetch(DB_URL, { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body), signal: controller.signal });
         clearTimeout(timer);
         if (!res.ok) { const t = await res.text(); throw new Error('DB ' + res.status + ': ' + t); }
         const data = await res.json();
         const r = data.results[0];
         if (r.type === 'error') throw new Error(r.error.message);
         const result = r.response.result;
         if (!result || !result.rows) return [];
         return result.rows.map(function(row) {
             const obj = {};
             const cells = Array.isArray(row) ? row : (row.value || row);
             result.cols.forEach(function(col, i) {
                 const cell = cells[i];
                 if (!cell || cell.type === 'null') { obj[col.name] = null; return; }
                 try { obj[col.name] = JSON.parse(cell.value); } catch(e) { obj[col.name] = cell.value; }
             });
             return obj;
         });
     } catch (e) {
         clearTimeout(timer);
         if (e.name === 'AbortError') throw new Error('DB query timed out');
         throw e;
     }
 }

async function init() {
    console.log('init() starting, auth=' + isAuthenticated());
    try {
        if (!isAuthenticated()) {
            console.log('Not authenticated, showing login');
            showLogin();
            return;
        }
        console.log('Authenticated, loading dashboard');
        hideLogin();
        // Remove hidden class from main content when authenticated
        document.querySelector('.main').classList.remove('hidden');
        console.log('Main hidden class removed:', !document.querySelector('.main').classList.contains('hidden'));
        try {
            await dbQuery('SELECT 1', [], { timeout: 5000 });
            console.log('DB ping OK');
        } catch(e) {
            console.warn('DB ping failed, continuing:', e.message);
        }
        console.log('calling showPage(dashboard)');
        showPage('dashboard');
    } catch(err) {
        console.error('init() crashed:', err);
    }
}

function showPage(page, filterStatus) {
    document.querySelectorAll('.nav-link').forEach(function(a) { a.classList.toggle('bg-gray-800', a.textContent.trim().toLowerCase() === page); });
    const c = document.getElementById('content');
    const loading = document.getElementById('admin-loading');
    if (loading) { loading.classList.remove('hidden'); loading.classList.add('flex'); }
    (async function() {
        try {
            if (page === 'dashboard') await renderDashboard(c);
            else if (page === 'inventory') await renderInventory(c);
            else if (page === 'orders') await renderOrders(c);
            else if (page === 'vendors') await renderVendors(c);
            else if (page === 'expenses') await renderExpenses(c);
            else if (page === 'analytics') await renderAnalytics(c);
            else if (page === 'reviews') await renderReviews(c, filterStatus || 'Approved');
            else if (page === 'item-details') await renderItemDetails(c);
        } catch(e) {
            c.innerHTML = '<div class="text-center py-20 text-red-500"><p>Error: ' + e.message + '</p></div>';
        } finally {
            if (loading) { loading.classList.add('hidden'); loading.classList.remove('flex'); }
        }
    })();
}

function viewItemDetails(itemNumber) { window.currentItemNumber = itemNumber; }

async function renderItemDetails(el) {
    const itemNumber = window.currentItemNumber;
    if (!itemNumber) { el.innerHTML = '<p class="text-gray-500">No item selected</p>'; return; }

    let item = null;
    try { item = (await dbQuery("SELECT * FROM items WHERE item_number = ?", [itemNumber]))[0]; } catch (e) { el.innerHTML = '<p class="text-red-500">Item query failed: ' + e.message + '</p>'; return; }
    if (!item) { el.innerHTML = '<p class="text-gray-500">Item not found</p>'; return; }

    let vendor = null;
    try { vendor = item.vendor_id ? (await dbQuery("SELECT * FROM vendors WHERE vendor_id = ?", [item.vendor_id]))[0] : null; } catch (e) { console.warn('Vendor query failed', e); }

    let orders = [];
    try { orders = await dbQuery("SELECT * FROM orders WHERE item_number = ?", [itemNumber]); } catch (e) { console.warn('Orders query failed', e); }

    let expenses = [];
    try { expenses = await dbQuery("SELECT * FROM expenses WHERE item_number = ?", [itemNumber]); } catch (e) { console.warn('Expenses query failed', e); }

    const photos = (function() {
        if (!item.photos) return [];
        if (Array.isArray(item.photos)) return item.photos;
        try { return JSON.parse(item.photos); } catch(e) { return []; }
    })();
    const totalRevenue = orders.reduce(function(sum, o) { return sum + (o.total || 0); }, 0);
    const totalExpenses = expenses.reduce(function(sum, e) { return sum + (e.amount || 0); }, 0);
    const profit = totalRevenue - (item.cost || 0) - totalExpenses;
    
    const orderRows = orders.map(function(o) {
        var orderData = typeof o.data === 'string' ? (function() { try { return JSON.parse(o.data); } catch(e) { return {}; } })() : (o.data || {});
        return '<tr class="border-t"><td class="p-2 font-mono">#' + (o.id || '—') + '</td><td class="p-2">' + (orderData.customer_name || '—') + '</td><td class="p-2">$'+ parseFloat(o.total || 0).toFixed(2) + '</td><td class="p-2">' + o.status + '</td></tr>';
    }).join('');
    const expenseRows = expenses.map(function(e) {
        return '<tr class="border-t"><td class="p-2">' + (e.type || '—') + '</td><td class="p-2">' + (e.description || '—') + '</td><td class="p-2">$'+ (e.amount || 0).toFixed(2) + '</td></tr>';
    }).join('');
    
    const photoHtml = photos.length ? '<div class="flex flex-wrap gap-2 mb-3">' + photos.map(function(p) { return '<img src="/api/image?item=' + encodeURIComponent(itemNumber) + '" class="h-24 w-auto object-contain bg-gray-50 rounded border" />'; }).join('') + '</div>' : '';
    
    el.innerHTML = '<div class="mb-3"><button onclick="showPage(\'inventory\')" class="text-gray-500 hover:underline text-sm">&larr; Back to Inventory</button></div>' +
        '<div class="bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden">' +
            '<div class="bg-gray-50 border-b border-gray-200 px-4 py-3">' +
                '<h2 class="font-anton text-xl">Item: ' + itemNumber + '</h2>' +
            '</div>' +
            '<div class="p-4">' +
                '<div class="grid grid-cols-1 lg:grid-cols-3 gap-4">' +
                    '<div class="space-y-3">' +
                        '<div class="bg-gray-50 rounded-lg p-3">' +
                            '<h3 class="text-xs font-bold text-gray-500 uppercase mb-2">Details</h3>' +
                            '<div class="space-y-1">' +
                                '<div class="flex justify-between"><span class="text-gray-500 text-xs">Title</span><span class="font-bold text-xs">' + (item.title || '-') + '</span></div>' +
                                '<div class="flex justify-between"><span class="text-gray-500 text-xs">SKU</span><span class="font-mono text-xs">' + (item.sku || '-') + '</span></div>' +
                                '<div class="flex justify-between"><span class="text-gray-500 text-xs">Category</span><span class="text-xs">' + (item.category || '-') + '</span></div>' +
                                '<div class="flex justify-between"><span class="text-gray-500 text-xs">Condition</span><span class="text-xs">' + (item.condition || '-') + '</span></div>' +
                                '<div class="flex justify-between"><span class="text-gray-500 text-xs">Status</span><span class="text-xs font-bold">' + (item.status || '-') + '</span></div>' +
                                '<div class="flex justify-between"><span class="text-gray-500 text-xs">Stock</span><span class="text-xs">' + (item.quantity || 0) + '</span></div>' +
                                '<div class="flex justify-between"><span class="text-gray-500 text-xs">Vendor</span><span class="text-xs">' + (vendor && vendor.name ? vendor.name : '—') + '</span></div>' +
                            '</div>' +
                        '</div>' +
                        '<div class="bg-gray-50 rounded-lg p-3">' +
                            '<h3 class="text-xs font-bold text-gray-500 uppercase mb-2">Financials</h3>' +
                            '<div class="space-y-1">' +
                                '<div class="flex justify-between"><span class="text-gray-500 text-xs">Cost</span><span class="text-xs">$' + (item.cost || 0).toFixed(2) + '</span></div>' +
                                '<div class="flex justify-between"><span class="text-gray-500 text-xs">Price</span><span class="font-bold text-red-600 text-xs">$' + (item.price || 0).toFixed(2) + '</span></div>' +
                                '<div class="flex justify-between border-t border-gray-200 mt-1 pt-1"><span class="text-gray-700 text-xs font-bold">Profit</span><span class="font-bold text-green-600 text-xs">$' + profit.toFixed(2) + '</span></div>' +
                            '</div>' +
                        '</div>' +
                    '</div>' +
                    '<div class="lg:col-span-2 space-y-3">' +
                        (photos.length ? '<div class="mb-3"><h3 class="text-xs font-bold text-gray-500 uppercase mb-2">Photos</h3>' + photoHtml + '</div>' : '') +
                        (item.description ? '<div class="mb-3"><h3 class="text-xs font-bold text-gray-500 uppercase mb-1">Description</h3><p class="text-gray-700 text-sm">' + item.description + '</p></div>' : '') +
                        (orders.length ? '<div class="mb-3"><h3 class="text-xs font-bold text-gray-500 uppercase mb-1">Orders (' + orders.length + ')</h3><div class="overflow-x-auto"><table class="w-full text-sm bg-white rounded-lg border overflow-hidden"><thead class="bg-gray-50"><tr><th class="p-1.5 text-left text-xs">#</th><th class="p-1.5 text-left text-xs">Customer</th><th class="p-1.5 text-xs">Total</th><th class="p-1.5 text-xs">Status</th></tr></thead><tbody>' + orderRows + '</tbody></table></div></div>' : '') +
                        (expenses.length ? '<div class="mb-3"><h3 class="text-xs font-bold text-gray-500 uppercase mb-1">Expenses (' + expenses.length + ')</h3><div class="overflow-x-auto"><table class="w-full text-sm bg-white rounded-lg border overflow-hidden"><thead class="bg-gray-50"><tr><th class="p-1.5 text-left text-xs">Type</th><th class="p-1.5 text-left text-xs">Description</th><th class="p-1.5 text-xs">Amount</th></tr></thead><tbody>' + expenseRows + '</tbody></table></div></div>' : '') +
                    '</div>' +
                '</div>' +
            '</div>' +
        '</div>';
}

async function renderDashboard(el) {
    let data;
    try {
        const res = await fetch('/api/dashboard');
        if (!res.ok) throw new Error('HTTP ' + res.status);
        data = await res.json();
    } catch (e) {
        console.warn('Dashboard API failed, using legacy queries:', e.message);
        data = await buildDashboardLegacy();
    }
    const { kpis = [], items = [], orders = [], soldItems = 0, monthlyProfit = 0, goal = { items: 0, profit: 0 }, lastMonthSold = 0, lastMonthProfit = 0, salesTrend = [], health = [], vendors = [], expenses30 = { total: 0, type: '—' }, alerts = [] } = data;

    const currentMonth = new Date().toISOString().slice(0,7);

    // Calculate days_stale in JS since julianday might be slow
    const now = new Date();
    items.forEach(function(i) {
        if (i.date_listed) {
            const listed = new Date(i.date_listed);
            i.days_stale = Math.floor((now - listed) / (1000 * 60 * 60 * 24));
        } else {
            i.days_stale = 0;
        }
    });
    const recentItems = items.slice(0, 10);
    
    const sellThroughRate = kpis[0]?.listed > 0 ? ((soldItems / kpis[0].listed) * 100).toFixed(1) : 0;
    const avgProfit = kpis[0]?.active > 0 ? (monthlyProfit / kpis[0].active).toFixed(2) : 0;
    const sellTrend = soldItems > lastMonthSold ? 'up' : soldItems < lastMonthSold ? 'down' : 'flat';
    const profitTrend = monthlyProfit > lastMonthProfit ? 'up' : monthlyProfit < lastMonthProfit ? 'down' : 'flat';
    const expenseRatio = monthlyProfit > 0 ? ((expenses30.total / monthlyProfit) * 100).toFixed(1) : 0;
    
    const progressPercent = goal.items > 0 ? Math.min(100, (soldItems / goal.items) * 100) : soldItems > 0 ? 100 : 0;
    const profitGoalPercent = goal.profit > 0 ? Math.min(100, (monthlyProfit / goal.profit) * 100) : monthlyProfit > 0 ? 100 : 0;
    
el.innerHTML = '<div class="grid grid-cols-4 gap-4 mb-6">' +
        '<div class="bg-white p-4 rounded-xl border"><div class="text-xs text-gray-500 uppercase">Total Inventory Value</div><div class="text-2xl font-bold">$' + (kpis[0]?.cost||0).toFixed(2) + '</div>' + sparkline(salesTrend, '#2563eb') + '</div>' +
        '<div class="bg-white p-4 rounded-xl border"><div class="text-xs text-gray-500 uppercase">Sell-through Rate</div><div class="flex items-center gap-2"><span class="text-2xl font-bold">' + sellThroughRate + '%</span><span class="text-xs ' + (sellTrend==='up'?'text-green-500':'text-red-500') + '">' + (sellTrend==='up'?'▲':sellTrend==='down'?'▼':'') + '</span></div></div>' +
        '<div class="bg-white p-4 rounded-xl border"><div class="text-xs text-gray-500 uppercase">Avg Profit / Item</div><div class="flex items-center gap-2"><span class="text-2xl font-bold">$' + avgProfit + '</span><span class="text-xs ' + (profitTrend==='up'?'text-green-500':profitTrend==='down'?'text-red-500':'') + '">' + (profitTrend==='up'?'▲':profitTrend==='down'?'▼':'') + '</span></div></div>' +
        '<div class="bg-white p-4 rounded-xl border"><div class="text-xs text-gray-500 uppercase">Active Listings</div><div class="text-2xl font-bold">' + (kpis[0]?.active||0) + '</div></div>' +
        '</div>' +
        
        '<div class="bg-white rounded-xl border p-6 mb-6"><div class="flex justify-between items-center mb-4">' +
        '<h3 class="font-anton text-2xl">Monthly Goals - ' + currentMonth + '</h3><button onclick="openGoalModal(\'' + currentMonth + '\', ' + goal.items + ', ' + goal.profit + ')" class="bg-red-600 text-white px-3 py-1 rounded font-bold text-xs hover:bg-red-700">Edit Goal</button></div>' +
        '<div class="grid grid-cols-2 gap-6">' +
        '<div><div class="flex justify-between mb-2"><span class="text-sm font-bold">Items Sold Goal</span><span class="text-sm">' + soldItems + ' / ' + (goal.items || '—') + '</span></div>' +

async function buildDashboardLegacy() {
    const currentMonth = new Date().toISOString().slice(0,7);
    let kpis = [], items = [], orders = [], salesTrend = [], health = [], vendors = [], expenses30 = { total: 0, type: '—' }, alerts = [];
    let soldItems = 0, monthlyProfit = 0, goal = { items: 0, profit: 0 };
    let lastMonthSold = 0, lastMonthProfit = 0;
    try { kpis = await dbQuery("SELECT COUNT(CASE WHEN status IN ('Available','Listed') THEN 1 END) as active, COALESCE(SUM(cost),0) as cost, COALESCE(SUM(price),0) as listed, COUNT(CASE WHEN status='Processing' THEN 1 END) as pending FROM items"); } catch (e) { console.error('KPIs failed:', e); }
    try { items = await dbQuery("SELECT item_number, sku, title, category, condition, status, cost, price, quantity, date_listed, date_sold FROM items ORDER BY date_listed DESC LIMIT 15"); } catch (e) { console.error('Items failed:', e); }
    try { orders = await dbQuery("SELECT * FROM orders WHERE status IN ('Pending','Processing') ORDER BY id DESC LIMIT 5"); } catch (e) { console.error('Orders failed:', e); }
    try {
        soldItems = (await dbQuery("SELECT COUNT(*) as sold FROM items WHERE status='Sold' AND date_sold LIKE ?", [currentMonth + '%']))[0]?.sold || 0;
        monthlyProfit = (await dbQuery("SELECT COALESCE(SUM(price-cost-fees),0) as profit FROM items WHERE status='Sold' AND date_sold LIKE ?", [currentMonth + '%']))[0]?.profit || 0;
        goal = await getMonthlyGoal(currentMonth);
    } catch (e) { console.warn('Goals failed:', e); }
    const lastMonth = new Date(); lastMonth.setMonth(lastMonth.getMonth() - 1);
    const lastMonthStr = lastMonth.toISOString().slice(0,7);
    try {
        lastMonthSold = (await dbQuery("SELECT COUNT(*) as sold FROM items WHERE status='Sold' AND date_sold LIKE ?", [lastMonthStr + '%']))[0]?.sold || 0;
        lastMonthProfit = (await dbQuery("SELECT COALESCE(SUM(price-cost-fees),0) as profit FROM items WHERE status='Sold' AND date_sold LIKE ?", [lastMonthStr + '%']))[0]?.profit || 0;
    } catch (e) { console.warn('Last month data failed:', e); }
    try { salesTrend = await dbQuery("SELECT date_sold as day, COUNT(*) as count, SUM(price-cost-fees) as profit FROM items WHERE date_sold >= date('now', '-30 days') AND status='Sold' GROUP BY date_sold ORDER BY day"); } catch (e) { console.warn('Sales trend failed:', e); }
    try { health = await dbQuery("SELECT condition, COUNT(*) as count FROM items WHERE condition IS NOT NULL GROUP BY condition"); } catch (e) { console.warn('Health failed:', e); }
    try { vendors = await dbQuery("SELECT v.name, v.vendor_id, COUNT(i.item_number) as items_sold, COALESCE(SUM(i.price - i.cost - i.fees),0) as profit FROM vendors v LEFT JOIN items i ON i.vendor_id = v.vendor_id AND i.status='Sold' GROUP BY v.vendor_id, v.name ORDER BY profit DESC LIMIT 5"); } catch (e) { console.warn('Vendors failed:', e); }
    try { expenses30 = (await dbQuery("SELECT COALESCE(SUM(amount),0) as total, type FROM expenses WHERE expense_date >= date('now', '-30 days') GROUP BY type ORDER BY total DESC LIMIT 1"))[0] || { total: 0, type: '—' }; } catch (e) { console.warn('Expenses failed:', e); }
    try {
        const staleItems = await dbQuery("SELECT item_number, title FROM items WHERE status IN ('Available','Listed') AND date_listed <= date('now', '-45 days') LIMIT 3");
        const lowMargin = await dbQuery("SELECT item_number, title, price, cost FROM items WHERE status='Available' AND (price - cost) <= 0 LIMIT 3");
        const noPhotos = await dbQuery("SELECT item_number, title FROM items WHERE (photos IS NULL OR photos='[]' OR photos='') AND status IN ('Available','Listed') LIMIT 3");
        alerts = staleItems.map(function(i) { return {type: 'stale', item: i.item_number, text: i.title}; }).concat(lowMargin.map(function(i) { return {type: 'margin', item: i.item_number, text: i.title}; })).concat(noPhotos.map(function(i) { return {type: 'photos', item: i.item_number, text: i.title}; }));
    } catch (e) { console.warn('Alerts failed:', e); }
    return { kpis: kpis, items: items, orders: orders, soldItems: soldItems, monthlyProfit: monthlyProfit, goal: goal, lastMonthSold: lastMonthSold, lastMonthProfit: lastMonthProfit, salesTrend: salesTrend, health: health, vendors: vendors, expenses30: expenses30, alerts: alerts };
}

async function renderInventory(el, searchTerm) {

        if (!res.ok) throw new Error('HTTP ' + res.status);
        items = (await res.json()).items;
    } catch (e) {
        console.warn('Inventory API failed, using legacy query:', e.message);
        items = await dbQuery("SELECT item_number, sku, title, category, condition, status, cost, price, quantity, date_listed, date_sold FROM items ORDER BY date_listed DESC");
    }
    const term = (searchTerm || '').toLowerCase();
    const filtered = term ? items.filter(function(i) {
        return (i.title || '').toLowerCase().includes(term) ||
               (i.item_number || '').toLowerCase().includes(term) ||
               (i.sku || '').toLowerCase().includes(term);
    }) : items;

        return '<tr class="border-t">' +
            '<td class="p-2 font-mono text-xs"><a href="#" onclick="viewItemDetails(\''+ i.item_number +'\'); showPage(\'item-details\'); return false;" style="color: #2563eb; text-decoration: underline;">'+ i.item_number +'</a></td>' +
            '<td class="p-2"><span contenteditable="true" class="editable" data-field="title" style="border-bottom:1px dashed #ccc">'+ (i.title||'Untitled') +'</span></td>' +
            '<td class="p-2"><span contenteditable="true" class="editable" data-field="category" style="border-bottom:1px dashed #ccc">'+ (i.category||'—') +'</span></td>' +
            '<td class="p-2">$'+ (i.cost||0).toFixed(2) +'</td>' +
            '<td class="p-2">$'+ (i.price||0).toFixed(2) +'</td>' +
            '<td class="p-2"><span contenteditable="true" class="editable" data-field="quantity" style="border-bottom:1px dashed #ccc">'+ (i.quantity||1) +'</span></td>' +
            '<td class="p-2"><span class="px-2 py-1 rounded text-xs font-bold '+ statusClass +'">'+ i.status +'</span></td>' +
            '<td class="p-2">' +
            '<button onclick="openEditItem(\''+ i.item_number +'\')" class="text-blue-600 hover:underline text-xs mr-2">Edit</button>' +
            '<button onclick="deleteItem(\''+ i.item_number +'\')" class="text-red-600 hover:underline text-xs">Delete</button>' +
            '</td></tr>';
    }).join('');
    el.innerHTML = '<div class="flex justify-between items-center mb-4 gap-4">' +
        '<div class="flex items-center gap-4 flex-1">' +
        '<h2 class="font-anton text-3xl mb-4">Inventory ('+ filtered.length +')</h2>' +
        '<input type="text" id="inventory-search" placeholder="Search by title, item #, or SKU..." value="'+ (searchTerm || '') +'" class="border rounded-xl p-2 text-sm flex-1 max-w-md">' +
        '</div>' +
        '<button onclick="openAddItem()" class="bg-red-600 text-white px-4 py-2 rounded-xl font-bold hover:bg-red-700">+ Add Item</button>' +
        '</div>' +
        (filtered.length ? '<div class="bg-white rounded-xl border overflow-x-auto"><table class="w-full text-sm rounded-xl overflow-hidden">' +
        '<thead><tr class="bg-gray-50"><th class="p-2 text-left">Item #</th><th class="p-2 text-left">Title</th><th class="p-2">Category</th><th class="p-2">Cost</th><th class="p-2">Price</th><th class="p-2">Stock</th><th class="p-2">Status</th><th class="p-2">Actions</th></tr></thead>' +
        '<tbody>'+ rows +'</tbody></table></div>' : '<div class="text-center py-20 text-gray-400">No items in inventory</div>');
    const searchInput = document.getElementById('inventory-search');
    if (searchInput) {
        searchInput.addEventListener('input', function() {
            renderInventory(el, this.value);
        });
    }
}

async function saveItem(e) {
    e.preventDefault();
    const photosInput = document.getElementById('m-photos');
    const newPhotos = [];
    const isEdit = !!window.editingItemNumber;
    const itemNumber = isEdit ? window.editingItemNumber : document.getElementById('m-num').value.trim();
    
    // Convert uploaded files to base64
    if (photosInput.files && photosInput.files.length > 0) {
        for (let i = 0; i < photosInput.files.length; i++) {
            const file = photosInput.files[i];
            if (file.type.startsWith('image/')) {
                newPhotos.push(await toBase64(file));
            }
        }
    }
    
// Get existing item if editing to preserve existing photos
     let existingPhotos = [];
     if (isEdit) {
         const existing = (await dbQuery("SELECT photos FROM items WHERE item_number = ?", [itemNumber]))[0];
         // Photos may come back as array or as JSON string from dbQuery
         if (existing && existing.photos) {
             if (Array.isArray(existing.photos)) {
                 existingPhotos = existing.photos;
             } else if (typeof existing.photos === 'string') {
                 try { existingPhotos = JSON.parse(existing.photos); } catch(e) { existingPhotos = []; }
             }
         }
     }
    
    const photos = newPhotos.length ? newPhotos : existingPhotos;
    console.log('Photos to save:', photos.length, 'items. isEdit:', isEdit);
    const item = {
        item_number: itemNumber,
        sku: document.getElementById('m-sku').value.trim(),
        title: document.getElementById('m-title').value.trim(),
        category: document.getElementById('m-cat').value,
        subcategory: '',
        condition: document.getElementById('m-con').value,
        status: document.getElementById('m-stat').value,
        cost: parseFloat(document.getElementById('m-cost').value)||0,
        price: parseFloat(document.getElementById('m-price').value)||0,
        fees: 0,
        description: document.getElementById('m-desc').value,
        vendor_id: document.getElementById('m-vendor')?.value || null, 
        photos: JSON.stringify(photos), 
        specs: '{}', 
        listing_url: '', 
        location: '',
        quantity: parseInt(document.getElementById('m-qty').value) || 1,
        date_sold: document.getElementById('m-date-sold')?.value || null
    };
    if (!item.item_number || !item.title) return toast('Item number and title required');
    try {
        if (isEdit) {
            const sql = item.date_sold
                ? 'UPDATE items SET sku=?,title=?,category=?,subcategory=?,condition=?,status=?,cost=?,price=?,fees=?,description=?,vendor_id=?,photos=?,specs=?,listing_url=?,location=?,quantity=?,date_sold=? WHERE item_number=?'
                : 'UPDATE items SET sku=?,title=?,category=?,subcategory=?,condition=?,status=?,cost=?,price=?,fees=?,description=?,vendor_id=?,photos=?,specs=?,listing_url=?,location=?,quantity=? WHERE item_number=?';
            const args = item.date_sold
                ? [item.sku,item.title,item.category,item.subcategory,item.condition,item.status,item.cost,item.price,item.fees,item.description,item.vendor_id,item.photos,item.specs,item.listing_url,item.location,item.quantity,item.date_sold,item.item_number]
                : [item.sku,item.title,item.category,item.subcategory,item.condition,item.status,item.cost,item.price,item.fees,item.description,item.vendor_id,item.photos,item.specs,item.listing_url,item.location,item.quantity,item.item_number];
            await dbQuery(sql, args);
        } else {

function toBase64(file) {
    return new Promise(function(resolve, reject) {
        const reader = new FileReader();
        reader.onload = function() { resolve(reader.result); };
        reader.onerror = reject;
        reader.readAsDataURL(file);
    });
}

async function saveOrder(e) {
    e.preventDefault();
    const customer = document.getElementById('o-customer').value.trim();
    const address = document.getElementById('o-address').value.trim();
    const itemNumber = document.getElementById('o-item').value;
    const total = parseFloat(document.getElementById('o-total').value) || 0;
    const status = document.getElementById('o-status').value;
    if (!customer || !address || !itemNumber) return toast('Customer, address, and item are required');
    const item = (await dbQuery("SELECT sku FROM items WHERE item_number = ?", [itemNumber]))[0];
    const base = item && item.sku ? item.sku : itemNumber;
    let orderId = 'ORD-' + base;
    let counter = 2;
    while ((await dbQuery("SELECT 1 FROM orders WHERE id = ?", [orderId])).length > 0) {
        orderId = 'ORD-' + base + '-' + counter;
        counter++;
    }
    const data = { customer_name: customer, shipping_address: address, item_number: itemNumber };
    try {
        await dbQuery('INSERT INTO orders (id, item_number, total, status, data) VALUES (?,?,?,?,?)', [orderId, itemNumber, total, status, JSON.stringify(data)]);
        closeModal();
        toast('Order saved!');
        showPage('orders');
    } catch(err) { toast('Save failed: ' + err.message); }
}

async function buildAnalyticsLegacy() {
    const mainStats = await dbQuery("SELECT COUNT(*) as total, COUNT(CASE WHEN status IN ('Available','Listed') THEN 1 END) as active, COUNT(CASE WHEN status='Sold' THEN 1 END) as sold, COALESCE(SUM(CASE WHEN status='Sold' THEN price-cost-fees END),0) as profit FROM items");
    const revenueStats = await dbQuery("SELECT COALESCE(SUM(price),0) as total_revenue, COALESCE(SUM(cost),0) as total_cost, COALESCE(SUM(fees),0) as total_fees FROM items WHERE status='Sold'");
    const expenseStats = await dbQuery("SELECT COALESCE(SUM(amount),0) as total_expenses FROM expenses");
    const categoryStats = await dbQuery("SELECT category, COUNT(*) as count, SUM(price) as value FROM items GROUP BY category ORDER BY value DESC");
    const statusStats = await dbQuery("SELECT status, COUNT(*) as count FROM items GROUP BY status");
    const recentSales = await dbQuery("SELECT item_number, title, price, cost, date_sold FROM items WHERE status='Sold' ORDER BY date_sold DESC LIMIT 10");
    return { mainStats: mainStats, revenueStats: revenueStats, expenseStats: expenseStats, categoryStats: categoryStats, statusStats: statusStats, recentSales: recentSales };
}

document.addEventListener('change', function(e) {
    if (e.target.id === 'm-photos') {
        const preview = document.getElementById('photo-previews');
        preview.innerHTML = '';
        Array.from(e.target.files).slice(0,6).forEach(function(file) {
            if (!file.type.startsWith('image/')) return;
            const reader = new FileReader();
            reader.onload = function(ev) {
                const img = document.createElement('img');
                img.src = ev.target.result;
                img.className = 'w-16 h-16 object-cover rounded border';
                preview.appendChild(img);
            };
            reader.readAsDataURL(file);
        });
    }
});


document.addEventListener('focusout', function(e) {
    if (e.target.classList.contains('editable')) {
        const field = e.target.dataset.field;
        const row = e.target.closest('tr');
        const itemNumber = row ? row.querySelector('.font-mono').textContent.trim() : null;
        if (!field || !itemNumber) return;
        let value = e.target.textContent.trim();
        if (e.target.dataset.type === 'number') value = parseFloat(value) || 0;
        
// Auto-set date_sold when status becomes Sold
         let sql, params;
         if (field === 'status' && value === 'Sold') {
             sql = 'UPDATE items SET status = ?, date_sold = DATE(\'now\') WHERE item_number = ?';
             params = [value, itemNumber];
         } else {
             sql = 'UPDATE items SET ' + field + ' = ? WHERE item_number = ?';
             params = [value, itemNumber];
         }
         
         dbQuery(sql, params).then(function() {
             toast('Saved');
             updateSystemStatus(true);
             // Log sold activity
             if (field === 'status' && value === 'Sold') {
                 (async function() {
                     try {
                         const item = (await dbQuery('SELECT title, price FROM items WHERE item_number = ?', [itemNumber]))[0];
                         await dbQuery('INSERT INTO activity_log (action, details, item_number, item_title) VALUES (?, ?, ?, ?)',
                             ['Sold', 'Sold for $' + (item && item.price || 0), itemNumber, item && item.title || '']);
                     } catch(e) { console.warn('Activity log failed:', e); }
                 })();
             }
         }).catch(function(e) { toast('Save failed: ' + e.message); updateSystemStatus(false); });
     }
});
 

// Monthly Goals Functions
async function getMonthlyGoal(month) {
    try {
        const rows = await dbQuery('SELECT items, profit FROM monthly_goals WHERE month = ?', [month]);
        if (rows.length) return { items: rows[0].items || 0, profit: rows[0].profit || 0 };
    } catch (e) { console.warn('Goal fetch failed', e); }
    return { items: 0, profit: 0 };
}

async function setMonthlyGoal(month, items, profit) {
    try {
        await dbQuery('INSERT INTO monthly_goals (month, items, profit) VALUES (?, ?, ?) ON CONFLICT(month) DO UPDATE SET items=excluded.items, profit=excluded.profit', [month, parseInt(items) || 0, parseFloat(profit) || 0]);
        toast('Goal saved!');
        showPage('dashboard');
    } catch (e) { toast('Save failed: ' + e.message); }
}

function renderStars(rating) {
    let html = '';
    for (let i = 1; i <= 5; i++) {
        html += '<svg class="w-4 h-4 inline-block ' + (i <= rating ? 'text-yellow-400' : 'text-gray-300') + '" fill="currentColor" viewBox="0 0 20 20"><path d="M10 2l2.39 7.15h7.22l-5.85 4.28 2.16 6.85L10 14.77l-5.85 4.28 2.16-6.85-5.85-4.28h7.22z"/></svg>';
    }
    return html;
}

async function renderReviews(el, filterStatus = 'Approved') {
    let reviews = [];
    try {
        const res = await fetch('/api/reviews');
        if (!res.ok) throw new Error('HTTP ' + res.status);
        reviews = (await res.json()).reviews;
    } catch (e) {
        console.warn('Reviews API failed, using legacy query:', e.message);
        try {
            reviews = await dbQuery("SELECT * FROM reviews ORDER BY created_at DESC");
        } catch (e2) {
            console.error('Reviews fetch failed:', e2);
        }
    }
    
    const filtered = reviews.filter(r => filterStatus === 'All' || r.status === filterStatus);
    const rows = filtered.map(function(r) {
        const statusClass = r.status === 'Approved' ? 'bg-green-100 text-green-800' : 
                          r.status === 'Rejected' ? 'bg-red-100 text-red-800' : 
                          'bg-yellow-100 text-yellow-800';
        const platformBadge = r.platform ? '<span class="px-2 py-0.5 bg-blue-100 text-blue-800 rounded text-xs ml-1">' + r.platform + '</span>' : '';
        return '<tr class="border-t">' +
            '<td class="p-2">' + renderStars(r.rating) + '</td>' +
            '<td class="p-2">' + (r.comment || '—').replace(/</g, '&lt;').replace(/"/g, '&quot;') + '</td>' +
            '<td class="p-2">' + (r.customer_name || '—') + platformBadge + '</td>' +
            '<td class="p-2"><span class="px-2 py-1 rounded text-xs font-bold ' + statusClass + '">' + r.status + '</span></td>' +
            '<td class="p-2 text-xs">' + formatDate(r.created_at) + '</td>' +
            '<td class="p-2 text-right">' +
            '<button onclick="openEditReview(' + r.review_id + ')" class="text-blue-600 hover:underline text-xs mr-2">Edit</button>' +
            '<button onclick="deleteReview(' + r.review_id + ')" class="text-red-600 hover:underline text-xs mr-2">Delete</button>' +
            (r.status === 'Pending' ? '<button onclick="approveReviewNow(' + r.review_id + ', true)" class="text-green-600 hover:underline text-xs mr-2">Approve</button>' +
             '<button onclick="approveReviewNow(' + r.review_id + ', false)" class="text-gray-600 hover:underline text-xs">Reject</button>' : '') +
            '</td></tr>';
    }).join('');
    
    el.innerHTML = '<div class="flex justify-between items-center mb-4">' +
        '<h2 class="font-anton text-3xl mb-4">Reviews (' + filtered.length + ')</h2>' +
        '<button onclick="openAddReview()" class="bg-red-600 text-white px-4 py-2 rounded-xl font-bold hover:bg-red-700">+ Add Review</button>' +
        '</div>' +
        '<div class="mb-4 flex gap-2">' +
        '<button onclick="showPage(\'reviews\', \'All\')" class="px-3 py-1 rounded ' + (filterStatus === 'All' ? 'bg-red-600 text-white' : 'border border-gray-300') + ' text-xs font-bold">All</button>' +
        '<button onclick="showPage(\'reviews\', \'Pending\')" class="px-3 py-1 rounded ' + (filterStatus === 'Pending' ? 'bg-red-600 text-white' : 'border border-gray-300') + ' text-xs font-bold">Pending</button>' +
        '<button onclick="showPage(\'reviews\', \'Approved\')" class="px-3 py-1 rounded ' + (filterStatus === 'Approved' ? 'bg-red-600 text-white' : 'border border-gray-300') + ' text-xs font-bold">Approved</button>' +
        '</div>' +
        (filtered.length ? '<table class="w-full text-sm bg-white rounded-xl border overflow-hidden">' +
        '<thead><tr class="bg-gray-50"><th class="p-2">Rating</th><th class="p-2">Comment</th><th class="p-2">Customer</th><th class="p-2">Status</th><th class="p-2">Date</th><th class="p-2 text-right">Actions</th></tr></thead>' +
        '<tbody>' + rows + '</tbody></table>' : '<div class="text-center py-20 text-gray-400">No reviews</div>');
}

    const items = await dbQuery('SELECT item_number, title FROM items ORDER BY item_number');

async function saveReview(e) {
    e.preventDefault();
    const review = {
        customer_name: document.getElementById('rev-name').value.trim(),
        rating: parseInt(document.getElementById('rev-rating').value),
        comment: document.getElementById('rev-comment').value.trim(),
        platform: document.getElementById('rev-platform').value || null,
        status: 'Pending'
    };
    if (!review.customer_name || !review.comment) return toast('Customer name and comment required');
    const itemNum = document.getElementById('rev-item').value || null;
    try {
        await dbQuery('INSERT INTO reviews (item_number, customer_name, rating, comment, platform, status) VALUES (?, ?, ?, ?, ?, ?)', 
            [itemNum, review.customer_name, review.rating, review.comment, review.platform, review.status]);
        closeModal();
        toast('Review saved!');
        showPage('reviews');
    } catch(err) { toast('Save failed: ' + err.message); }
}

async function updateReview(e) {
    e.preventDefault();
    const review = {
        customer_name: document.getElementById('rev-name').value.trim(),
        rating: parseInt(document.getElementById('rev-rating').value),
        comment: document.getElementById('rev-comment').value.trim(),
        platform: document.getElementById('rev-platform').value || null,
        status: 'Pending'
    };
    if (!review.customer_name || !review.comment) return toast('Customer name and comment required');
    const itemNum = document.getElementById('rev-item').value || null;
    const platform = document.getElementById('rev-platform').value || null;
    const args = itemNum ? [itemNum, review.customer_name, review.rating, review.comment, platform, review.status, window.editingReviewId] : 
                           [review.customer_name, review.rating, review.comment, platform, review.status, window.editingReviewId];
    const sql = itemNum ? 'UPDATE reviews SET item_number=?, customer_name=?, rating=?, comment=?, platform=?, status=? WHERE review_id=?' :
                          'UPDATE reviews SET customer_name=?, rating=?, comment=?, platform=?, status=? WHERE review_id=?';
    try {
        await dbQuery(sql, args);
        window.editingReviewId = null;
        closeModal();
        toast('Review updated!');
        showPage('reviews');
    } catch(err) { toast('Update failed: ' + err.message); }
}

async function deleteReview(reviewId) {
    if (!confirm('Delete this review?')) return;
    try {
        await dbQuery('DELETE FROM reviews WHERE review_id = ?', [reviewId]);
        toast('Deleted');
        showPage('reviews');
    } catch(e) { toast('Delete failed: ' + e.message); }
}

async function approveReviewNow(reviewId, approve) {
    const status = approve ? 'Approved' : 'Rejected';
    try {
        await dbQuery('UPDATE reviews SET status = ? WHERE review_id = ?', [status, reviewId]);
        toast(approve ? 'Review approved!' : 'Review rejected');
        showPage('reviews');
    } catch(e) { toast('Update failed: ' + e.message); }
}

function updateSystemStatus(connected) {
    const dot = document.getElementById('status-dot');
    const text = document.getElementById('status-text');
    if (!dot || !text) return;
    if (connected) {
        dot.className = 'w-2 h-2 rounded-full bg-green-500';
        text.textContent = 'Online';
        text.className = 'text-xs text-green-400';
    } else {
        dot.className = 'w-2 h-2 rounded-full bg-red-500';
        text.textContent = 'Offline';
        text.className = 'text-xs text-red-400';
    }
}

async function renderSalesMap() {
    const mapContainer = document.getElementById('sales-map');
    if (!mapContainer) return;
    
    const orders = await dbQuery("SELECT * FROM orders ORDER BY id DESC");
    const orderData = orders.map(function(o) {
        const data = typeof o.data === 'string' ? (function() { try { return JSON.parse(o.data); } catch(e) { return {}; } })() : (o.data || {});
        return {
            id: o.id,
            total: parseFloat(o.total || 0),
            address: data.shipping_address || '',
            customer: data.customer_name || ''
        };
    });
    
    const stateCoords = {
        'CA': [34.0522, -118.2437], 'NY': [40.7128, -74.0060], 'TX': [31.0859, -100.1029],
        'FL': [27.9944, -82.7504], 'WA': [47.6062, -122.3321], 'IL': [41.8781, -87.6298],
        'PA': [39.9526, -75.1652], 'OH': [39.9612, -82.9988], 'GA': [33.7490, -84.3880],
        'NC': [35.7796, -78.6382], 'MI': [42.3314, -83.0458], 'NJ': [40.7306, -74.1729],
        'VA': [37.4316, -78.6569], 'AZ': [33.4484, -112.0740], 'TN': [36.1627, -86.7816],
        'MA': [42.3601, -71.0589], 'IN': [39.7684, -86.1581], 'MO': [38.6270, -92.1926],
        'MD': [38.9072, -77.0369], 'WI': [43.0731, -89.4012], 'MN': [44.9778, -93.2650],
        'CO': [39.7392, -104.9903], 'AL': [32.5367, -86.6447], 'SC': [33.9982, -80.8397],
        'LA': [30.0513, -91.9495], 'KY': [38.2527, -85.7585], 'WV': [38.9112, -79.6499],
        'AR': [35.2011, -92.4442], 'IA': [41.8780, -93.0791], 'MS': [32.2988, -89.7810],
        'NM': [35.6870, -105.9378], 'OK': [35.4676, -97.5164], 'ID': [43.6151, -116.2023],
        'HI': [21.3069, -157.8583], 'AK': [61.2181, -156.7682], 'DC': [38.9072, -77.0369],
        'NV': [36.1699, -115.1398], 'UT': [40.7608, -111.8910], 'MT': [46.8717, -110.3654],
        'ND': [46.8292, -100.7836], 'SD': [44.3683, -100.3579], 'NE': [41.2565, -99.6712],
        'KS': [39.0997, -95.6791], 'ME': [44.3106, -69.7719], 'NH': [43.2061, -71.5373],
        'VT': [44.4682, -72.7178], 'WY': [43.0757, -107.2921], 'DE': [38.9108, -75.5210],
        'RI': [41.8240, -71.4128], 'CT': [41.7637, -72.6851], 'NJ': [40.7306, -74.1729]
    };
    
const stateCounts = {};
        orderData.forEach(function(o) {
            const addr = o.address.toLowerCase();
            Object.keys(stateCoords).forEach(function(state) {
                const stateAbbr = state.toLowerCase();
                const regex = new RegExp('\\b' + stateAbbr + '\\b', 'i');
                if (regex.test(addr)) {
                    stateCounts[state] = (stateCounts[state] || 0) + 1;
                }
            });
        });
    
    const map = L.map('sales-map').setView([39.8283, -98.5795], 4);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
    }).addTo(map);
    
    Object.keys(stateCounts).forEach(function(state) {
        const coords = stateCoords[state];
        if (!coords) return;
        const count = stateCounts[state];
        const marker = L.marker(coords).addTo(map);
        marker.bindPopup('<b>' + state + '</b><br>Sales: ' + count + '<br>Revenue: $' + (count * 100).toFixed(2)).openPopup();
    });
}

init();
