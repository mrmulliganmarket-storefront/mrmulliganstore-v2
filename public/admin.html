<script>
const DB_URL = "/api/turso";

function isAuthenticated() {
    return localStorage.getItem('adminAuth') === 'true';
}

function showLogin() {
    document.getElementById('login-overlay').classList.remove('hidden');
    document.querySelector('.main').classList.add('hidden');
}

function hideLogin() {
    document.getElementById('login-overlay').classList.add('hidden');
    document.querySelector('.main').classList.remove('hidden');
}

function login(e) {
    e.preventDefault();
    const user = document.getElementById('admin-username').value;
    const pass = document.getElementById('admin-password').value;
    const errorEl = document.getElementById('login-error');
    fetch('/api/admin/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username: user, password: pass })
    }).then(function (r) {
        return r.json().then(function (j) { return { ok: r.ok, j: j }; });
    }).then(function (res) {
        if (res.ok && res.j && res.j.ok) {
            localStorage.setItem('adminAuth', 'true');
            localStorage.setItem('adminToken', res.j.token);
            hideLogin();
            refreshSkuBrands();
            loadLegendFromDb();
            loadMessageBadge();
            loadReviewBadge();
            loadVisitorBadge();
            init();
        } else {
            errorEl.classList.remove('hidden');
            setTimeout(function () { errorEl.classList.add('hidden'); }, 3000);
        }
    }).catch(function () {
        errorEl.classList.remove('hidden');
        setTimeout(function () { errorEl.classList.add('hidden'); }, 3000);
    });
    return false;
}

function logout() {
    const token = localStorage.getItem('adminToken');
    if (token) {
        fetch('/api/admin/logout', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token }
        }).catch(function () {});
    }
    stopSessionHeartbeat();
    resetInventoryState();
    localStorage.removeItem('adminAuth');
    localStorage.removeItem('adminToken');
    location.reload();
}

// Non-blocking session keep-alive. The server already slides the expiry on each
// authenticated admin call; this just refreshes it between idle gaps so long
// editing sessions don't expire unexpectedly. Failures are ignored.
function keepAliveSession() {
    const token = localStorage.getItem('adminToken');
    if (!token) return;
    fetch('/api/admin/extend', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token }
    }).catch(function () {});
}

// Periodic heartbeat: keeps the session alive for as long as the admin tab is
// open, even while you're filling out a form with no DB activity. This prevents
// the "session ended" expiry that used to hit mid-edit.
let sessionHeartbeat = null;
function startSessionHeartbeat() {
    stopSessionHeartbeat();
    keepAliveSession();
    sessionHeartbeat = setInterval(keepAliveSession, 4 * 60 * 1000); // every 4 minutes
}
function stopSessionHeartbeat() {
    if (sessionHeartbeat) { clearInterval(sessionHeartbeat); sessionHeartbeat = null; }
}

function toast(msg) {
    const el = document.createElement('div');
    el.className = 'toast';
    el.textContent = msg;
    document.body.appendChild(el);
    setTimeout(function() { el.remove(); }, 3000);
}

function downloadCSV(filename, headers, rows) {
    const escapeCSV = function(v) {
        const s = String(v ?? '');
        return s.indexOf(',') >= 0 || s.indexOf('"') >= 0 || s.indexOf('\n') >= 0 ? '"' + s.replace(/"/g, '""') + '"' : s;
    };
    const csv = [headers.map(escapeCSV).join(',')].concat(rows.map(function(r) { return headers.map(function(h) { return escapeCSV(r[h] ?? ''); }).join(','); })).join('\n');
    const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = filename;
    a.style.display = 'none';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
}

let LAST_INVENTORY = [];
let LAST_ORDERS = [];
let LAST_EXPENSES = [];
let LAST_LEGEND = null;

function exportInventoryCSV() {
    const headers = ['Item #','SKU','Title','Category','Condition','Status','Cost','Price','Quantity','Date Listed','Date Sold'];
    const rows = LAST_INVENTORY.map(function(i) {
        return { 'Item #': i.item_number, SKU: i.sku, Title: i.title, Category: i.category, Condition: i.condition, Status: i.status, Cost: i.cost, Price: i.price, Quantity: i.quantity, 'Date Listed': i.date_listed, 'Date Sold': i.date_sold };
    });
    downloadCSV('inventory-export.csv', headers, rows);
}

function exportOrdersCSV() {
    const headers = ['Order #','Customer','Email','Shipping Address','Total','Status','Sale Date','Items'];
    const rows = LAST_ORDERS.map(function(o) {
        var orderData = typeof o.data === 'string' ? (function() { try { return JSON.parse(o.data); } catch(e) { return {}; } })() : (o.data || {});
        const itemNum = orderData.item_number || o.item_number || '';
        const sku = orderData.sku || itemNum;
        const items = Array.isArray(orderData.items) && orderData.items.length ? orderData.items : (itemNum ? [{ item_number: itemNum, price: o.total }] : []);
        const itemSummary = items.map(function(it) { return (it.name || '') + ' (' + (it.item_number || '') + ') $' + (parseFloat(it.price) || 0).toFixed(2); }).join('; ');
        return { 'Order #': o.id, Customer: orderData.customer_name || '—', Email: orderData.customer_email || '—', 'Shipping Address': orderData.shipping_address || '—', Total: o.total, Status: o.status, 'Sale Date': orderData.sale_date || o.created_at || o.date_sold, Items: itemSummary };
    });
    downloadCSV('orders-export.csv', headers, rows);
}

function exportExpensesCSV() {
    const headers = ['Date','Type','Amount','Description','SKU #'];
    const rows = LAST_EXPENSES.map(function(e) {
        return { Date: e.expense_date, Type: e.type, Amount: e.amount, Description: e.description || '', 'SKU #': e.item_sku || '' };
    });
    downloadCSV('expenses-export.csv', headers, rows);
}

function exportLegendCSV() {
    if (!LAST_LEGEND) return toast('No legend data loaded yet');
    const headers = ['Field','Code','Label','Category'];
    const rows = [];
    ['vendor','type','size','source'].forEach(function(field) {
        const entries = LAST_LEGEND[field] || {};
        const isType = field === 'type';
        Object.keys(entries).forEach(function(code) {
            const e = entries[code];
            rows.push({ Field: field.charAt(0).toUpperCase() + field.slice(1), Code: code, Label: isType ? e.label : e, Category: isType ? (e.category || '') : '' });
        });
    });
    downloadCSV('sku-legend-export.csv', headers, rows);
}

function closeModal() { document.getElementById('modal').classList.remove('open'); document.getElementById('modal').querySelector('.modal').classList.remove('modal-wide'); document.getElementById('modal-body').innerHTML = ''; }
  function openModal(html) { const body = document.getElementById('modal-body'); body.innerHTML = html; const modal = document.getElementById('modal'); modal.classList.add('open'); const inner = modal.querySelector('.modal'); if (inner) inner.scrollTop = 0; }
 
 // Sparkline SVG helper
 function sparkline(data, color) {
     if (!data || !data.length) return '';
     const max = Math.max.apply(null, data.map(function(d) { return d.count || 0; }).concat([1]));
     const points = data.map(function(d, i) { return (i * 30) + ',' + (12 - (d.count / max * 12)); }).join(' ');
     return '<svg class="w-20 h-6" viewBox="0 0 120 12"><polyline points="' + points + '" fill="none" stroke="' + color + '" stroke-width="2"/></svg>';
 }
 
 // Date formatting helper - MM/DD/YY format
 function formatDate(dateStr) {
    if (!dateStr) return '';
    // Handle YYYY-MM-DD format by splitting to avoid timezone issues
    const parts = dateStr.split('-');
    if (parts.length === 3) {
        const year = parts[0].slice(-2);
        const month = parts[1];
        const day = parts[2];
        return month + '/' + day + '/' + year;
    }
    const d = new Date(dateStr);
    const month = String(d.getMonth() + 1).padStart(2, '0');
const day = String(d.getDate()).padStart(2, '0');
     const year = String(d.getFullYear()).slice(-2);
     return month + '/' + day + '/' + year;
 }
 
 async function dbQuery(sql, args=[], { timeout = 120000 } = {}) {
     const controller = new AbortController();
     const timer = setTimeout(function() { controller.abort(); }, timeout);
     const body = {
         requests: [{
             type: 'execute',
             stmt: {
                 sql: sql,
                 args: args.map(function(a) {
                 if (a === null || a === undefined) return { type: 'null', value: '' };
                 if (typeof a === 'number') return { type: 'float', value: a };
                 return { type: 'text', value: String(a) };
             })
             }
         }]
     };
     try {
          const adminToken = localStorage.getItem('adminToken') || '';
          const res = await fetch(DB_URL, { method:'POST', headers:{'Content-Type':'application/json','Authorization':'Bearer '+adminToken}, body: JSON.stringify(body), signal: controller.signal });
         clearTimeout(timer);
          if (!res.ok) {
              if (res.status === 401) {
                  localStorage.removeItem('adminAuth');
                  localStorage.removeItem('adminToken');
                  toast('Session expired. Please log in again.');
                  showLogin();
                  throw new Error('Session expired');
              }
              const t = await res.text(); throw new Error('DB ' + res.status + ': ' + t);
          }
         const data = await res.json();
          const r = data.results[0];
          if (r.type === 'error') throw new Error(r.error.message);
          const result = r.response.result;
          if (!result || !result.rows) return [];
          // Server slides the session expiry on every authenticated admin call,
          // so active editing keeps you logged in. Fire a lightweight keep-alive
          // in the background (no await) as an extra guard.
          keepAliveSession();
          return result.rows.map(function(row) {
             const obj = {};
             const cells = Array.isArray(row) ? row : (row.value || row);
             result.cols.forEach(function(col, i) {
                 const cell = cells[i];
                 if (!cell || cell.type === 'null') { obj[col.name] = null; return; }
                 try { obj[col.name] = JSON.parse(cell.value); } catch(e) { obj[col.name] = cell.value; }
             });
             return obj;
         });
     } catch (e) {
         clearTimeout(timer);
         if (e.name === 'AbortError') throw new Error('DB query timed out');
         throw e;
     }
 }

async function init() {
    console.log('init() starting, auth=' + isAuthenticated());
    try {
        if (!isAuthenticated()) {
            console.log('Not authenticated, showing login');
            showLogin();
            return;
        }
        console.log('Authenticated, loading dashboard');
        hideLogin();
        // Remove hidden class from main content when authenticated
        document.querySelector('.main').classList.remove('hidden');
        console.log('Main hidden class removed:', !document.querySelector('.main').classList.contains('hidden'));
        loadLegendFromDb();
        loadMessageBadge();
        loadReviewBadge();
        loadVisitorBadge();
        try {
            await dbQuery('SELECT 1', [], { timeout: 5000 });
            console.log('DB ping OK');
        } catch(e) {
            console.warn('DB ping failed, continuing:', e.message);
        }
        startSessionHeartbeat();
        console.log('calling showPage(dashboard)');
        showPage('dashboard');
    } catch(err) {
        console.error('init() crashed:', err);
    }
}

function showPage(page, filterStatus) {
    document.querySelectorAll('.nav-link').forEach(function(a) { a.classList.toggle('bg-gray-800', a.textContent.trim().toLowerCase() === page); });
    const c = document.getElementById('content');
    const loading = document.getElementById('admin-loading');
    if (loading) { loading.classList.remove('hidden'); loading.classList.add('flex'); }
    (async function() {
        try {
            if (page === 'dashboard') await renderDashboard(c);
            else if (page === 'inventory') await renderInventory(c);
            else if (page === 'orders') await renderOrders(c);
            else if (page === 'vendors') await renderVendors(c);
            else if (page === 'expenses') await renderExpenses(c);
            else if (page === 'reviews') await renderReviews(c, filterStatus || 'Approved');
            else if (page === 'messages') await renderMessages(c);
            else if (page === 'visitors') await renderVisitors(c);
            else if (page === 'subscribers') await renderSubscribers(c);
            else if (page === 'legend') await renderLegend(c);
            else if (page === 'item-details') await renderItemDetails(c);
        } catch(e) {
            c.innerHTML = '<div class="text-center py-20 text-red-500"><p>Error: ' + escapeHtml(e.message) + '</p></div>';
        } finally {
            if (loading) { loading.classList.add('hidden'); loading.classList.remove('flex'); }
        }
    })();
}

function viewItemDetails(itemNumber) { window.currentItemNumber = itemNumber; }

async function renderItemDetails(el) {
    const itemNumber = window.currentItemNumber;
    if (!itemNumber) { el.innerHTML = '<p class="text-gray-500">No item selected</p>'; return; }

    let item = null;
    try { item = (await dbQuery("SELECT * FROM items WHERE item_number = ?", [itemNumber]))[0]; } catch (e) { el.innerHTML = '<p class="text-red-500">Item query failed: ' + escapeHtml(e.message) + '</p>'; return; }
    if (!item) { el.innerHTML = '<p class="text-gray-500">Item not found</p>'; return; }

    let vendor = null;
    try { vendor = item.vendor_id ? (await dbQuery("SELECT * FROM vendors WHERE vendor_id = ?", [item.vendor_id]))[0] : null; } catch (e) { console.warn('Vendor query failed', e); }

    let orders = [];
    try { orders = await dbQuery("SELECT * FROM orders WHERE item_number = ?", [itemNumber]); } catch (e) { console.warn('Orders query failed', e); }

    let expenses = [];
    try { expenses = await dbQuery("SELECT * FROM expenses WHERE item_number = ?", [itemNumber]); } catch (e) { console.warn('Expenses query failed', e); }

    const photos = (function() {
        if (!item.photos) return [];
        if (Array.isArray(item.photos)) return item.photos;
        try { return JSON.parse(item.photos); } catch(e) { return []; }
    })();
    const totalRevenue = orders.reduce(function(sum, o) { return sum + (o.total || 0); }, 0);
    const totalExpenses = expenses.reduce(function(sum, e) { return sum + (e.amount || 0); }, 0);
    const profit = totalRevenue - (item.cost || 0) - totalExpenses;
    
    const orderRows = orders.map(function(o) {
        var orderData = typeof o.data === 'string' ? (function() { try { return JSON.parse(o.data); } catch(e) { return {}; } })() : (o.data || {});
        return '<tr class="border-t"><td class="p-2 font-mono">#' + escapeHtml(o.id || '—') + '</td><td class="p-2">' + escapeHtml(orderData.customer_name || '—') + '</td><td class="p-2">$'+ parseFloat(o.total || 0).toFixed(2) + '</td><td class="p-2">' + escapeHtml(o.status) + '</td></tr>';
    }).join('');
    const expenseRows = expenses.map(function(e) {
        return '<tr class="border-t"><td class="p-2">' + (e.type || '—') + '</td><td class="p-2">' + (e.description || '—') + '</td><td class="p-2">$'+ (e.amount || 0).toFixed(2) + '</td></tr>';
    }).join('');
    
    const photoHtml = photos.length ? '<div class="flex flex-wrap gap-2 mb-3">' + photos.map(function(p) { return '<img src="/api/image?item=' + encodeURIComponent(itemNumber) + '" class="h-24 w-auto object-contain bg-gray-50 rounded border" />'; }).join('') + '</div>' : '';
    
    el.innerHTML = '<div class="mb-3"><button onclick="showPage(\'inventory\')" class="text-gray-500 hover:underline text-sm">&larr; Back to Inventory</button></div>' +
        '<div class="bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden">' +
            '<div class="bg-gray-50 border-b border-gray-200 px-4 py-3">' +
                '<h2 class="font-anton text-xl">Item: ' + itemNumber + '</h2>' +
            '</div>' +
            '<div class="p-4">' +
                '<div class="grid grid-cols-1 lg:grid-cols-3 gap-4">' +
                    '<div class="space-y-3">' +
                        '<div class="bg-gray-50 rounded-lg p-3">' +
                            '<h3 class="text-xs font-bold text-gray-500 uppercase mb-2">Details</h3>' +
                            '<div class="space-y-1">' +
                                '<div class="flex justify-between"><span class="text-gray-500 text-xs">Title</span><span class="font-bold text-xs">' + escapeHtml(item.title || '-') + '</span></div>' +
                                '<div class="flex justify-between"><span class="text-gray-500 text-xs">SKU</span><span class="font-mono text-xs">' + escapeHtml(item.sku || '-') + '</span></div>' +

async function buildDashboardLegacy() {
    const currentMonth = new Date().toISOString().slice(0,7);
    let kpis = [], items = [], orders = [], salesTrend = [], health = [], vendors = [], expenses30 = { total: 0, type: '—' }, alerts = [];
    let soldItems = 0, monthlyProfit = 0, goal = { items: 0, profit: 0 };
    let lastMonthSold = 0, lastMonthProfit = 0;
    try { kpis = await dbQuery("SELECT COUNT(CASE WHEN status IN ('Available','Listed') THEN 1 END) as active, COALESCE(SUM(cost),0) as cost, COALESCE(SUM(price),0) as listed, COUNT(CASE WHEN status='Processing' THEN 1 END) as pending FROM items"); } catch (e) { console.error('KPIs failed:', e); }
    try { items = await dbQuery("SELECT item_number, sku, title, category, condition, status, cost, price, quantity, date_listed, date_sold FROM items ORDER BY date_listed DESC LIMIT 15"); } catch (e) { console.error('Items failed:', e); }
    try { orders = await dbQuery("SELECT * FROM orders WHERE status IN ('Pending','Processing') ORDER BY id DESC LIMIT 5"); } catch (e) { console.error('Orders failed:', e); }
    try {
        soldItems = (await dbQuery("SELECT COUNT(*) as sold FROM items WHERE status='Sold' AND date_sold LIKE ?", [currentMonth + '%']))[0]?.sold || 0;
        monthlyProfit = (await dbQuery("SELECT COALESCE(SUM(price-cost-fees),0) as profit FROM items WHERE status='Sold' AND date_sold LIKE ?", [currentMonth + '%']))[0]?.profit || 0;
        goal = await getMonthlyGoal(currentMonth);
    } catch (e) { console.warn('Goals failed:', e); }
    const lastMonth = new Date(); lastMonth.setMonth(lastMonth.getMonth() - 1);
    const lastMonthStr = lastMonth.toISOString().slice(0,7);
    try {
        lastMonthSold = (await dbQuery("SELECT COUNT(*) as sold FROM items WHERE status='Sold' AND date_sold LIKE ?", [lastMonthStr + '%']))[0]?.sold || 0;
        lastMonthProfit = (await dbQuery("SELECT COALESCE(SUM(price-cost-fees),0) as profit FROM items WHERE status='Sold' AND date_sold LIKE ?", [lastMonthStr + '%']))[0]?.profit || 0;
    } catch (e) { console.warn('Last month data failed:', e); }
    try { salesTrend = await dbQuery("SELECT date_sold as day, COUNT(*) as count, SUM(price-cost-fees) as profit FROM items WHERE date_sold >= date('now', '-30 days') AND status='Sold' GROUP BY date_sold ORDER BY day"); } catch (e) { console.warn('Sales trend failed:', e); }
    try { health = await dbQuery("SELECT condition, COUNT(*) as count FROM items WHERE condition IS NOT NULL GROUP BY condition"); } catch (e) { console.warn('Health failed:', e); }
    try { vendors = await dbQuery("SELECT v.name, v.vendor_id, COUNT(i.item_number) as items_sold, COALESCE(SUM(i.price - i.cost - i.fees),0) as profit FROM vendors v LEFT JOIN items i ON i.vendor_id = v.vendor_id AND i.status='Sold' GROUP BY v.vendor_id, v.name ORDER BY profit DESC LIMIT 5"); } catch (e) { console.warn('Vendors failed:', e); }
    try { expenses30 = (await dbQuery("SELECT COALESCE(SUM(amount),0) as total, type FROM expenses WHERE expense_date >= date('now', '-30 days') GROUP BY type ORDER BY total DESC LIMIT 1"))[0] || { total: 0, type: '—' }; } catch (e) { console.warn('Expenses failed:', e); }
    try {
        const staleItems = await dbQuery("SELECT item_number, title FROM items WHERE status IN ('Available','Listed') AND date_listed <= date('now', '-45 days') LIMIT 3");
        const lowMargin = await dbQuery("SELECT item_number, title, price, cost FROM items WHERE status='Available' AND (price - cost) <= 0 LIMIT 3");
        const noPhotos = await dbQuery("SELECT item_number, title FROM items WHERE (photos IS NULL OR photos='[]' OR photos='') AND status IN ('Available','Listed') LIMIT 3");
        alerts = staleItems.map(function(i) { return {type: 'stale', item: i.item_number, text: i.title}; }).concat(lowMargin.map(function(i) { return {type: 'margin', item: i.item_number, text: i.title}; })).concat(noPhotos.map(function(i) { return {type: 'photos', item: i.item_number, text: i.title}; }));
    } catch (e) { console.warn('Alerts failed:', e); }
    let lifetime = { total_revenue: 0, total_cost: 0, total_fees: 0, total_expenses: 0, lifetime_profit: 0 };
    let lifetimeCategories = [];
    try {
        lifetime = (await dbQuery("SELECT (SELECT COALESCE(SUM(price),0) FROM items WHERE status='Sold') as total_revenue, (SELECT COALESCE(SUM(cost),0) FROM items WHERE status='Sold') as total_cost, (SELECT COALESCE(SUM(fees),0) FROM items WHERE status='Sold') as total_fees, (SELECT COALESCE(SUM(amount),0) FROM expenses) as total_expenses, (SELECT COALESCE(SUM(price-cost-fees),0) FROM items WHERE status='Sold') - (SELECT COALESCE(SUM(amount),0) FROM expenses) as lifetime_profit"))[0] || lifetime;
        lifetimeCategories = await dbQuery("SELECT category, COUNT(*) as count, COALESCE(SUM(price),0) as revenue, COALESCE(SUM(price-cost-fees),0) as profit FROM items WHERE status='Sold' GROUP BY category ORDER BY profit DESC");
    } catch (e) { console.warn('Lifetime data failed:', e); }
    return { kpis: kpis, items: items, orders: orders, soldItems: soldItems, monthlyProfit: monthlyProfit, goal: goal, lastMonthSold: lastMonthSold, lastMonthProfit: lastMonthProfit, salesTrend: salesTrend, health: health, vendors: vendors, expenses30: expenses30, alerts: alerts, lifetime: lifetime, lifetimeCategories: lifetimeCategories };
}

function tagNumberOf(itemNumber) {
    const digits = String(itemNumber || '').match(/\d/g);
    if (!digits || !digits.length) return 0;
    const last3 = digits.slice(-3).join('');
    return parseInt(last3, 10) || 0;
}

const INVENTORY_SORTS = [
    { value: 'tag-asc', label: 'Tag # (first → last)' },
    { value: 'tag-desc', label: 'Tag # (last → first)' },
    { value: 'newest', label: 'Newest listed' },
    { value: 'oldest', label: 'Oldest listed' },
    { value: 'price-asc', label: 'Price (low → high)' },
    { value: 'price-desc', label: 'Price (high → low)' },
    { value: 'title', label: 'Title (A → Z)' }
];

const INVENTORY_STATUSES = ['all', 'Available', 'Listed', 'Hold', 'Repairs', 'Sold'];

// Persistent inventory view state — survives Add/Edit/Delete re-renders and only
// resets when the admin dashboard is closed (logout) or the filter is changed.
let INV_SEARCH = '';
let INV_SORT = 'tag-asc';
let INV_STATUS = 'all';

function resetInventoryState() {
    INV_SEARCH = '';
    INV_SORT = 'tag-asc';
    INV_STATUS = 'all';
}

async function renderInventory(el, searchTerm, sortKey, statusFilter) {
    // Fall back to the persistent state when no explicit value is passed
    // (e.g. after an Add/Edit/Delete re-render triggered by showPage).
    if (searchTerm === undefined) searchTerm = INV_SEARCH;
    if (sortKey === undefined) sortKey = INV_SORT;
    if (statusFilter === undefined) statusFilter = INV_STATUS;
    let items;
    try {
        const res = await fetch('/api/inventory');
        if (!res.ok) throw new Error('HTTP ' + res.status);
        items = (await res.json()).items;
    } catch (e) {
        console.warn('Inventory API failed, using legacy query:', e.message);
        items = await dbQuery("SELECT item_number, sku, title, category, condition, status, cost, price, quantity, date_listed, date_sold FROM items ORDER BY date_listed DESC");
    }
    searchTerm = searchTerm || '';
    sortKey = sortKey || 'tag-asc';
    statusFilter = statusFilter || 'all';

    const term = searchTerm.toLowerCase();
    let filtered = term ? items.filter(function(i) {
        return (i.title || '').toLowerCase().includes(term) ||
               (i.item_number || '').toLowerCase().includes(term) ||
               (i.sku || '').toLowerCase().includes(term);
    }) : items.slice();

    if (statusFilter !== 'all') {
        filtered = filtered.filter(function(i) { return i.status === statusFilter; });
    }

    filtered.sort(function(a, b) {
        switch (sortKey) {
            case 'tag-asc': return tagNumberOf(a.item_number) - tagNumberOf(b.item_number);
            case 'tag-desc': return tagNumberOf(b.item_number) - tagNumberOf(a.item_number);
            case 'newest': return (b.date_listed || '').localeCompare(a.date_listed || '');
            case 'oldest': return (a.date_listed || '').localeCompare(b.date_listed || '');
            case 'price-asc': return (parseFloat(a.price) || 0) - (parseFloat(b.price) || 0);
            case 'price-desc': return (parseFloat(b.price) || 0) - (parseFloat(a.price) || 0);
            case 'title': return (a.title || '').localeCompare(b.title || '');
            default: return 0;
        }
    });

    const rows = filtered.map(function(i) {
        const statusClass = i.status === 'Available' ? 'bg-green-100 text-green-800' : i.status === 'Hold' ? 'bg-orange-100 text-orange-800' : i.status === 'Repairs' ? 'bg-purple-100 text-purple-800' : i.status === 'Sold' ? 'bg-yellow-100 text-yellow-800' : 'bg-blue-100 text-blue-800';
        return '<tr class="border-t">' +
            '<td class="p-2 font-mono text-xs"><a href="#" onclick="viewItemDetails(\''+ i.item_number +'\'); showPage(\'item-details\'); return false;" style="color: #2563eb; text-decoration: underline;">'+ i.item_number +'</a></td>' +
            '<td class="p-2 text-center font-mono text-xs font-bold text-gray-600">'+ tagNumberOf(i.item_number) +'</td>' +
            '<td class="p-2"><span contenteditable="true" class="editable" data-field="title" style="border-bottom:1px dashed #ccc">'+ (i.title||'Untitled') +'</span></td>' +
            '<td class="p-2"><span contenteditable="true" class="editable" data-field="category" style="border-bottom:1px dashed #ccc">'+ (i.category||'—') +'</span></td>' +
            '<td class="p-2">$'+ (i.cost||0).toFixed(2) +'</td>' +
            '<td class="p-2">$'+ (i.price||0).toFixed(2) +'</td>' +
            '<td class="p-2"><span contenteditable="true" class="editable" data-field="quantity" style="border-bottom:1px dashed #ccc">'+ (i.quantity||1) +'</span></td>' +
            '<td class="p-2"><span class="px-2 py-1 rounded text-xs font-bold '+ statusClass +'">'+ escapeHtml(i.status) +'</span></td>' +
            '<td class="p-2">' +
            '<button onclick="openEditItem(\''+ i.item_number +'\')" class="text-blue-600 hover:underline text-xs mr-2">Edit</button>' +
            '<button onclick="deleteItem(\''+ i.item_number +'\')" class="text-red-600 hover:underline text-xs">Delete</button>' +
            '</td></tr>';
    }).join('');

    const sortOptionsHtml = INVENTORY_SORTS.map(function(s) {
        return '<option value="' + s.value + '"' + (s.value === sortKey ? ' selected' : '') + '>' + s.label + '</option>';
    }).join('');
    const statusOptionsHtml = INVENTORY_STATUSES.map(function(s) {
        return '<option value="' + s + '"' + (s === statusFilter ? ' selected' : '') + '>' + (s === 'all' ? 'All Statuses' : s) + '</option>';
    }).join('');

    LAST_INVENTORY = filtered;
    el.innerHTML = '<div class="flex flex-wrap justify-between items-end mb-4 gap-4">' +
        '<div class="flex items-center gap-4 flex-wrap">' +
        '<h2 class="font-anton text-3xl mb-4">Inventory ('+ filtered.length +')</h2>' +
        '<input type="text" id="inventory-search" placeholder="Search by title, item #, or SKU..." value="'+ escapeAttr(searchTerm) +'" class="border rounded-xl p-2 text-sm w-64">' +
        '<select id="inventory-status" title="Filter by status" class="border rounded-xl p-2 text-sm bg-white">'+ statusOptionsHtml +'</select>' +
        '<select id="inventory-sort" title="Sort results" class="border rounded-xl p-2 text-sm bg-white">'+ sortOptionsHtml +'</select>' +
        '</div>' +
        '<div class="flex items-center gap-2">' +
        '<button onclick="exportInventoryCSV()" class="bg-green-600 text-white px-3 py-2 rounded-xl font-bold hover:bg-green-700 text-sm">Export CSV</button>' +
        '<button onclick="openAddItem()" class="bg-red-600 text-white px-4 py-2 rounded-xl font-bold hover:bg-red-700">+ Add Item</button>' +
        '</div>' +
        '</div>' +
        (filtered.length ? '<div class="bg-white rounded-xl border overflow-x-auto"><table class="w-full text-sm rounded-xl overflow-hidden">' +
        '<thead><tr class="bg-gray-50"><th class="p-2 text-left">Item #</th><th class="p-2 text-center">Tag #</th><th class="p-2 text-left">Title</th><th class="p-2">Category</th><th class="p-2">Cost</th><th class="p-2">Price</th><th class="p-2">Stock</th><th class="p-2">Status</th><th class="p-2">Actions</th></tr></thead>' +
        '<tbody>'+ rows +'</tbody></table></div>' : '<div class="text-center py-20 text-gray-400">No items in inventory</div>');

    function applyFilters() {
        const s = document.getElementById('inventory-search');
        const sort = document.getElementById('inventory-sort');
        const stat = document.getElementById('inventory-status');
        // Persist the chosen values so Add/Edit/Delete re-renders keep them.
        INV_SEARCH = s ? s.value : searchTerm;
        INV_SORT = sort ? sort.value : sortKey;
        INV_STATUS = stat ? stat.value : statusFilter;
        renderInventory(el, INV_SEARCH, INV_SORT, INV_STATUS);
    }
    const searchInput = document.getElementById('inventory-search');
    const sortInput = document.getElementById('inventory-sort');
    const statusInput = document.getElementById('inventory-status');
    if (searchInput) searchInput.addEventListener('input', applyFilters);
    if (sortInput) sortInput.addEventListener('change', applyFilters);
    if (statusInput) statusInput.addEventListener('change', applyFilters);
}

async function renameItemNumber(oldNum, newNum) {
    const trimmed = (newNum || '').trim();
    if (!trimmed) throw new Error('Item number cannot be empty');
    if (trimmed === oldNum) return;
    const clash = await dbQuery("SELECT item_number FROM items WHERE item_number = ?", [trimmed]);
    if (clash && clash.length) throw new Error('Item number already in use: ' + trimmed);
    const oldItem = (await dbQuery("SELECT * FROM items WHERE item_number = ?", [oldNum]))[0];
    if (!oldItem) throw new Error('Item not found: ' + oldNum);
    try {
        const columns = Object.keys(oldItem).filter(function(col) { return col !== 'has_photos'; });
        const itemNumberIndex = columns.indexOf('item_number');
        if (itemNumberIndex === -1) throw new Error('item_number column not found in item data');
        const values = columns.map(function(col) {
            let val = oldItem[col];
            if (col === 'photos' || col === 'specs') {
                if (typeof val === 'object') val = JSON.stringify(val);
            }
            return val;
        });
        values[itemNumberIndex] = trimmed;
        await dbQuery('INSERT INTO items (' + columns.join(',') + ') VALUES (' + columns.map(function() { return '?'; }).join(',') + ')', values);
        const orders = await dbQuery("SELECT id, data FROM orders WHERE item_number = ?", [oldNum]);
        for (const o of (orders || [])) {
            let dataStr = o.data;
            let updated = false;
            if (dataStr) {
                try {
                    const d = typeof dataStr === 'string' ? JSON.parse(dataStr) : dataStr;
                    if (d && d.item_number !== undefined) { d.item_number = trimmed; dataStr = JSON.stringify(d); updated = true; }
                } catch (e) {}
            }
            if (updated) await dbQuery("UPDATE orders SET item_number = ?, data = ? WHERE id = ?", [trimmed, dataStr, o.id]);
            else await dbQuery("UPDATE orders SET item_number = ? WHERE id = ?", [trimmed, o.id]);
        }
        try { await dbQuery("UPDATE expenses SET item_number = ? WHERE item_number = ?", [trimmed, oldNum]); } catch(e) { console.warn('Expense renumber skipped', e); }
        try { await dbQuery("UPDATE reviews SET item_number = ? WHERE item_number = ?", [trimmed, oldNum]); } catch(e) { console.warn('Review renumber skipped', e); }
        try { await dbQuery("UPDATE activity_log SET item_number = ? WHERE item_number = ?", [trimmed, oldNum]); } catch(e) { console.warn('Activity renumber skipped', e); }
        await dbQuery("DELETE FROM items WHERE item_number = ?", [oldNum]);
    } catch (e) {
        try { await dbQuery("DELETE FROM items WHERE item_number = ?", [trimmed]); } catch (cleanupErr) {}
        throw e;
    }
}

        for (let i = 0; i < photosInput.files.length; i++) {
            const file = photosInput.files[i];
            if (file.type.startsWith('image/')) {
                newPhotos.push(await toBase64(file));

            const insertSql = item.status === 'Sold'

                : 'INSERT INTO items (' + baseCols + ',date_listed,date_sold) VALUES (' + baseVals + ',CURRENT_TIMESTAMP,?)';
            const insertArgs = item.status === 'Sold'
                ? baseArgs.concat([item.date_sold || new Date().toISOString().slice(0,10)])
                : baseArgs.concat([item.date_sold]);
            await dbQuery(insertSql, insertArgs);
        }
        window.editingItemNumber = null;
        closeModal();
        toast(isEdit ? 'Item updated!' : 'Item saved!');
        showPage('inventory');
    } catch(e) { toast('Save failed: ' + e.message); }
}

function toBase64(file) {
    return new Promise(function(resolve, reject) {
        const reader = new FileReader();
        reader.onload = function() { resolve(reader.result); };
        reader.onerror = reject;
        reader.readAsDataURL(file);
    });
}

const ORDER_SORTS = [
    { value: 'newest', label: 'Newest first' },
    { value: 'oldest', label: 'Oldest first' },
    { value: 'total-asc', label: 'Total (low → high)' },
    { value: 'total-desc', label: 'Total (high → low)' },
    { value: 'customer', label: 'Customer (A → Z)' },
    { value: 'status', label: 'Status (A → Z)' }
];
const ORDER_STATUSES = ['all', 'Pending', 'Processing', 'Shipped', 'Delivered', 'Cancelled'];

let ORD_SEARCH = '';
let ORD_SORT = 'newest';
let ORD_STATUS = 'all';

function resetOrdersState() {
    ORD_SEARCH = '';
    ORD_SORT = 'newest';
    ORD_STATUS = 'all';
}

async function renderOrders(el, searchTerm, sortKey, statusFilter) {
    if (searchTerm === undefined) searchTerm = ORD_SEARCH;
    if (sortKey === undefined) sortKey = ORD_SORT;
    if (statusFilter === undefined) statusFilter = ORD_STATUS;
    let orders;
    try {
        const res = await fetch('/api/orders');
        if (!res.ok) throw new Error('HTTP ' + res.status);
        orders = (await res.json()).orders;
    } catch (e) {
        console.warn('Orders API failed, using legacy query:', e.message);
        orders = await dbQuery("SELECT orders.*, items.date_sold FROM orders LEFT JOIN items ON orders.item_number = items.item_number ORDER BY orders.id DESC LIMIT 500");
    }
    let skuMap = {};
    try {
        const skuRows = await dbQuery("SELECT item_number, sku FROM items WHERE sku IS NOT NULL AND sku != '' LIMIT 500");
        skuRows.forEach(function(r) { if (r.item_number) skuMap[r.item_number] = r.sku; });
    } catch (e) { /* non-fatal */ }
    searchTerm = (searchTerm || '').toLowerCase();
    sortKey = sortKey || 'newest';
    statusFilter = statusFilter || 'all';
    let filtered = orders.filter(function(o) {
        var orderData = typeof o.data === 'string' ? (function() { try { return JSON.parse(o.data); } catch(e) { return {}; } })() : (o.data || {});
        const term = searchTerm || '';
        if (!term) return true;
        const displayId = (orderData.sku || (orderData.item_number || o.item_number || '')) ? ('ORD-' + (orderData.sku || orderData.item_number || o.id || '')) : (o.id || '');
        const custName = (orderData.customer_name || '').toLowerCase();
        const custEmail = (orderData.customer_email || '').toLowerCase();
        const id = (o.id || '').toLowerCase();
        return custName.includes(term) || custEmail.includes(term) || id.includes(term) || displayId.toLowerCase().includes(term);
    });
    if (statusFilter !== 'all') {
        filtered = filtered.filter(function(o) { return (o.status || '') === statusFilter; });
    }
    filtered.sort(function(a, b) {
        switch (sortKey) {
            case 'newest': return (b.id || '').localeCompare(a.id || '');
            case 'oldest': return (a.id || '').localeCompare(b.id || '');
            case 'total-desc': return (parseFloat(b.total || 0) - parseFloat(a.total || 0));
            case 'total-asc': return (parseFloat(a.total || 0) - parseFloat(b.total || 0));
            case 'customer': {
                var aData = typeof a.data === 'string' ? (function() { try { return JSON.parse(a.data); } catch(e) { return {}; } })() : (a.data || {});
                var bData = typeof b.data === 'string' ? (function() { try { return JSON.parse(b.data); } catch(e) { return {}; } })() : (b.data || {});
                return (aData.customer_name || '').localeCompare(bData.customer_name || '');
            }
            case 'status': return (a.status || '').localeCompare(b.status || '');
            default: return 0;
        }
    });
    const orderRows = filtered.map(function(o) {
        var orderData = typeof o.data === 'string' ? (function() { try { return JSON.parse(o.data); } catch(e) { return {}; } })() : (o.data || {});
        const needsAddr = !orderData.shipping_address;
        const itemNum = orderData.item_number || o.item_number || '';
        const custCell = escapeHtml(orderData.customer_name || '—') + (orderData.customer_email ? '<div class="text-xs text-gray-400">' + escapeHtml(orderData.customer_email) + '</div>' : '') + (needsAddr ? '<div class="text-xs text-red-500">needs address</div>' : '');
        const resolvedSku = orderData.sku || (itemNum ? skuMap[itemNum] : null);
        const displayId = resolvedSku ? ('ORD-' + resolvedSku) : (itemNum ? ('ORD-' + itemNum) : (o.id || '—'));
        let lineItems = Array.isArray(orderData.items) && orderData.items.length ? orderData.items : (itemNum ? [{ item_number: itemNum, name: orderData.customer_name ? '' : '', price: o.total }] : []);
        if (!lineItems.length && itemNum) lineItems = [{ item_number: itemNum, name: '', price: o.total }];
        const invoiceRows = lineItems.map(function(it) {
            const nm = it.name || '';
            const num = it.item_number || '';
            const price = (parseFloat(it.price) || 0).toFixed(2);
            const label = nm ? escapeHtmlMsg(nm) + (num ? ' <span class="text-gray-400 font-mono">(' + escapeHtmlMsg(num) + ')</span>' : '') : (num ? '<span class="font-mono">' + escapeHtmlMsg(num) + '</span>' : '<span class="text-gray-400">Unnamed item</span>');
            return '<div class="py-0.5">' + label + ' — <span class="font-semibold">$' + price + '</span></div>';
        }).join('');
        const invoice = '<div class="text-xs leading-snug">' + (invoiceRows || '<span class="text-gray-400">No items</span>') + '</div>' +
            '<div class="text-xs text-gray-500 mt-1 border-t border-gray-100 pt-1">Total: <span class="font-bold">$' + parseFloat(o.total || 0).toFixed(2) + '</span></div>' +
            (orderData.shipping_address ? '<div class="text-xs text-gray-500 mt-1 whitespace-pre-line">Ship: ' + escapeHtmlMsg(orderData.shipping_address) + '</div>' : '') +
            (orderData.paypal_order_id ? '<div class="text-xs text-gray-400 font-mono mt-1">PP: ' + escapeHtmlMsg(orderData.paypal_order_id) + '</div>' : '');
        const saleDate = orderData.sale_date || o.created_at || o.date_sold;
        return '<tr class="border-t align-top"><td class="p-2 font-mono whitespace-nowrap">#' + escapeHtmlMsg(displayId) + '</td><td class="p-2 font-bold">' + custCell + '</td><td class="p-2">' + invoice + '</td><td class="p-2">' + escapeHtml(o.status) + '</td><td class="p-2">' + formatDate(saleDate) + '</td><td class="p-2 text-right whitespace-nowrap"><button onclick="openEditOrder(\'' + (o.id || '').replace(/'/g, "\\'") + '\')" class="text-blue-600 hover:underline text-xs mr-2">Edit</button><button onclick="deleteOrder(\'' + (o.id || '').replace(/'/g, "\\'") + '\')" class="text-red-600 hover:underline text-xs">Delete</button></td></tr>';
    }).join('');
    LAST_ORDERS = filtered;
    const sortOptionsHtml = ORDER_SORTS.map(function(s) {
        return '<option value="' + s.value + '"' + (s.value === sortKey ? ' selected' : '') + '>' + s.label + '</option>';
    }).join('');
    const statusOptionsHtml = ORDER_STATUSES.map(function(s) {
        return '<option value="' + s + '"' + (s === statusFilter ? ' selected' : '') + '>' + (s === 'all' ? 'All Statuses' : s) + '</option>';
    }).join('');
    el.innerHTML = '<div class="flex justify-between items-center mb-4">' +
        '<h2 class="font-anton text-3xl mb-4">Orders (' + filtered.length + ')</h2>' +
        '<div class="flex items-center gap-2">' +
        '<button onclick="exportOrdersCSV()" class="bg-green-600 text-white px-3 py-2 rounded-xl font-bold hover:bg-green-700 text-sm">Export CSV</button>' +
        '<button onclick="openAddOrder()" class="bg-red-600 text-white px-4 py-2 rounded-xl font-bold hover:bg-red-700">+ Add Order</button>' +
        '</div>' +
        '</div>' +
        '<div class="flex items-center gap-4 mb-4 flex-wrap">' +
        '<input type="text" id="orders-search" placeholder="Search by order #, customer, email..." value="' + escapeAttr(searchTerm) + '" class="border rounded-xl p-2 text-sm w-64">' +
        '<select id="orders-status" title="Filter by status" class="border rounded-xl p-2 text-sm bg-white">' + statusOptionsHtml + '</select>' +
        '<select id="orders-sort" title="Sort results" class="border rounded-xl p-2 text-sm bg-white">' + sortOptionsHtml + '</select>' +
        '</div>' +
        (filtered.length ? '<div class="bg-white rounded-xl border overflow-x-auto"><table class="w-full text-sm rounded-xl overflow-hidden"><thead><tr class="bg-gray-50"><th class="p-2 text-left">#</th><th class="p-2 text-left">Customer</th><th class="p-2 text-left">Invoice</th><th class="p-2">Status</th><th class="p-2">Date Sold</th><th class="p-2 text-right">Actions</th></tr></thead><tbody>' + orderRows + '</tbody></table></div>' : '<div class="text-center py-20 text-gray-400">No orders</div>');
    function applyFilters() {
        const s = document.getElementById('orders-search');
        const sort = document.getElementById('orders-sort');
        const stat = document.getElementById('orders-status');
        ORD_SEARCH = s ? s.value : searchTerm;
        ORD_SORT = sort ? sort.value : sortKey;
        ORD_STATUS = stat ? stat.value : statusFilter;
        renderOrders(el, ORD_SEARCH, ORD_SORT, ORD_STATUS);
    }
    const searchInput = document.getElementById('orders-search');
    const sortInput = document.getElementById('orders-sort');
    const statusInput = document.getElementById('orders-status');
    if (searchInput) searchInput.addEventListener('input', applyFilters);
    if (sortInput) sortInput.addEventListener('change', applyFilters);
    if (statusInput) statusInput.addEventListener('change', applyFilters);
}

async function saveOrder(e) {
    e.preventDefault();
    const customer = document.getElementById('o-customer').value.trim();
    const address = document.getElementById('o-address').value.trim();
    const email = (document.getElementById('o-email') ? document.getElementById('o-email').value.trim() : '');
    const itemNumber = document.getElementById('o-item').value;
    const total = parseFloat(document.getElementById('o-total').value) || 0;
    const status = document.getElementById('o-status').value;
    const saleDate = document.getElementById('o-sale-date').value;
    if (!customer || !address || !itemNumber) return toast('Customer, address, and item are required');
    const item = (await dbQuery("SELECT sku FROM items WHERE item_number = ?", [itemNumber]))[0];
    const base = item && item.sku ? item.sku : itemNumber;
    let orderId = 'ORD-' + base;
    let counter = 2;
    while ((await dbQuery("SELECT 1 FROM orders WHERE id = ?", [orderId])).length > 0) {
        orderId = 'ORD-' + base + '-' + counter;
        counter++;
    }
    const data = { customer_name: customer, customer_email: email, shipping_address: address, item_number: itemNumber, sale_date: saleDate };
    try {
        await dbQuery('INSERT INTO orders (id, item_number, total, status, data) VALUES (?,?,?,?,?)', [orderId, itemNumber, total, status, JSON.stringify(data)]);
        closeModal();
        toast('Order saved!');
        showPage('orders');
    } catch(err) { toast('Save failed: ' + err.message); }
}

async function updateOrder(e, orderId) {
    e.preventDefault();
        const customer = document.getElementById('o-customer').value.trim();
        const address = document.getElementById('o-address').value.trim();
        const email = (document.getElementById('o-email') ? document.getElementById('o-email').value.trim() : '');
        const itemNumber = document.getElementById('o-item').value;
        const total = parseFloat(document.getElementById('o-total').value) || 0;
        const status = document.getElementById('o-status').value;
        const tracking = (document.getElementById('o-tracking') ? document.getElementById('o-tracking').value.trim() : '');
        const saleDate = (document.getElementById('o-sale-date') ? document.getElementById('o-sale-date').value : '');
        if (!customer || !address || !itemNumber) return toast('Customer, address, and item are required');
        const previous = (await dbQuery("SELECT status, data FROM orders WHERE id = ?", [orderId]))[0];
        const prevData = previous && previous.data ? (typeof previous.data === 'string' ? (function(){try{return JSON.parse(previous.data);}catch(e){return{};}})() : previous.data) : {};
        try {
            await dbQuery('UPDATE orders SET item_number = ?, total = ?, status = ?, data = ? WHERE id = ?', [itemNumber, total, status, JSON.stringify({ customer_name: customer, customer_email: email, shipping_address: address, tracking: tracking, item_number: itemNumber, sale_date: saleDate }), orderId]);
            // Fire a status email when moving into Shipped/Delivered (and email is present)
            const statusChanged = !previous || (previous.status || '') !== status;
            if (statusChanged && email && (status === 'Shipped' || status === 'Delivered')) {
                const items = Array.isArray(prevData.items) && prevData.items.length ? prevData.items : (prevData.item_number ? [{ item_number: prevData.item_number, name: '' }] : []);
                fetch('/api/notify/order-status', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ customer_email: email, status: status, items: items, orderLabel: orderId, tracking: tracking })
                }).catch(function() {});
            }
        closeModal();
        toast('Order updated!');
        showPage('orders');
    } catch(err) { toast('Update failed: ' + err.message); }
}

document.addEventListener('change', function(e) {
    if (e.target.id === 'm-photos') {
        const preview = document.getElementById('photo-previews');
        preview.innerHTML = '';
        Array.from(e.target.files).slice(0,6).forEach(function(file) {
            if (!file.type.startsWith('image/')) return;
            const reader = new FileReader();
            reader.onload = function(ev) {
                const img = document.createElement('img');
                img.src = ev.target.result;
                img.className = 'w-16 h-16 object-cover rounded border';
                preview.appendChild(img);
            };
            reader.readAsDataURL(file);
        });
    }
});


document.addEventListener('focusout', function(e) {
    if (e.target.classList.contains('editable')) {
        const field = e.target.dataset.field;
        const row = e.target.closest('tr');
        const itemNumber = row ? row.querySelector('.font-mono').textContent.trim() : null;
        if (!field || !itemNumber) return;
        let value = e.target.textContent.trim();
        if (e.target.dataset.type === 'number') value = parseFloat(value) || 0;
        
// Auto-set date_sold when status becomes Sold
         let sql, params;
         if (field === 'status' && value === 'Sold') {
             sql = 'UPDATE items SET status = ?, date_sold = DATE(\'now\') WHERE item_number = ?';
             params = [value, itemNumber];
         } else {
             sql = 'UPDATE items SET ' + field + ' = ? WHERE item_number = ?';
             params = [value, itemNumber];
         }
         
         dbQuery(sql, params).then(function() {
             toast('Saved');
             updateSystemStatus(true);
             // Log sold activity
             if (field === 'status' && value === 'Sold') {
                 (async function() {
                     try {
                         const item = (await dbQuery('SELECT title, price FROM items WHERE item_number = ?', [itemNumber]))[0];
                         await dbQuery('INSERT INTO activity_log (action, details, item_number, item_title) VALUES (?, ?, ?, ?)',
                             ['Sold', 'Sold for $' + (item && item.price || 0), itemNumber, item && item.title || '']);
                     } catch(e) { console.warn('Activity log failed:', e); }
                 })();
             }
         }).catch(function(e) { toast('Save failed: ' + e.message); updateSystemStatus(false); });
     }
});

                '<td class="p-2 text-xs text-gray-500 whitespace-nowrap">' + escapeHtml(formatDate(r.date_sold)) + '</td>' +
                '</tr>';
        }).join('');
        body.innerHTML =
            '<div class="mb-3 text-sm text-gray-600"><b>' + rows.length + '</b> item' + (rows.length === 1 ? '' : 's') + ' sold · <b>$' + total.toFixed(2) + '</b> total</div>' +

            '<thead class="bg-gray-50"><tr><th class="p-2 text-left">Title</th><th class="p-2 text-left">SKU Alias</th><th class="p-2 text-right">Price</th><th class="p-2 text-left">Sold</th></tr></thead>' +
            '<tbody>' + rowsHtml + '</tbody></table></div>' +
            '<div class="mt-3 text-right text-xs text-gray-400">Goal period: ' + month + '</div>';
    } catch (e) {
        const body = document.getElementById('sold-items-body');

        if (loading) loading.remove();
        if (body) body.innerHTML = '<div class="text-center py-10 text-red-500">Could not load sold items: ' + escapeHtml(e.message) + '</div>';
    }

// --- Database-backed persistence for the SKU Legend ---
// localStorage is used as a fast synchronous cache (getSkuLegend stays sync so
// parseSmartSku / applySmartSku keep working), but the database is the source of
// truth so codes survive cache clears and are shared across browsers.
async function loadLegendFromDb() {
    try {
        await dbQuery("CREATE TABLE IF NOT EXISTS sku_legend (field TEXT NOT NULL, code TEXT NOT NULL, label TEXT, category TEXT, PRIMARY KEY (field, code))");
        // Always start from the full built-in default seed so the standard
        // brands/types/sizes/sources are guaranteed present, then overlay any
        // custom rows stored in the database on top.
        const def = seedSkuLegend();
        const legend = { vendor: {}, type: {}, size: {}, source: {} };
        ['vendor', 'type', 'size', 'source'].forEach(function(f) {
            legend[f] = JSON.parse(JSON.stringify(def[f] || {}));
        });
        let rows = [];
        try { rows = await dbQuery("SELECT field, code, label, category FROM sku_legend"); } catch (e) { rows = []; }
        rows.forEach(function(r) {
            if (r.field === 'type') legend.type[r.code] = { label: r.label || '', category: r.category || '' };
            else legend[r.field][r.code] = r.label || '';
        });
        setSkuLegend(legend);
        await persistLegendToDb(legend);
        return legend;
    } catch (e) {
        console.warn('loadLegendFromDb failed, using cache', e);
        return getSkuLegend();
    }
}

async function persistLegendToDb(legend) {
    try {
        const rows = [];
        ['vendor','type','size','source'].forEach(function(field) {
            const obj = legend[field] || {};
            Object.keys(obj).forEach(function(code) {
                if (field === 'type') rows.push([field, code, obj[code].label, obj[code].category]);
                else rows.push([field, code, obj[code], '']);
            });
        });
        for (let i = 0; i < rows.length; i++) {
            await dbQuery("INSERT OR REPLACE INTO sku_legend (field, code, label, category) VALUES (?, ?, ?, ?)", rows[i]);
        }
    } catch (e) {
        console.warn('persistLegendToDb failed', e);
    }
}
// Build the list of brand codes from the live inventory so the compact decoder
// can split <brand><type><size><price> correctly for every brand.
async function refreshSkuBrands() {
    try {
        const res = await fetch('/api/inventory');
        if (!res.ok) return;
        const data = await res.json();
        const set = {};
        (data.items || []).forEach(function(i) {
            const sku = (i.sku || '').trim();
            const m = sku.match(/^([A-Za-z0-9\-]+)-(2XL|XL|L|M|S)-\d+$/);
            if (m) set[m[1]] = true;
            const num = (i.item_number || '').trim();
            const mm = num.match(/^([A-Za-z0-9\-]+?)(2XL|XL|L|M|S)\d+-\d+$/);
            if (mm) {
                let head = mm[1];
                const kt = ['PO','P','H'];
                for (let k = 0; k < kt.length; k++) { if (head.endsWith(kt[k]) && head.length > kt[k].length) head = head.slice(0, head.length - kt[k].length); }
                set[head] = true;
            }
        });
        SKU_BRANDS = Object.keys(set).sort(function(a,b){ return b.length - a.length; });
    } catch (e) { console.warn('refreshSkuBrands failed', e); }
}

// Parse a coded SKU: Brand-Type-Size-Month-Price-Source-Tag#
function parseSmartSku(raw) {
    if (!raw) return null;
    raw = String(raw).trim();
    const legend = getSkuLegend();
    const r = { raw: raw, unknown: [], segments: [] };
    // Compact format: <brand><type><size><priceCents>-<tag>  e.g. NKPM5799-114
    const compact = raw.match(/^([A-Za-z0-9\-]+?)(2XL|XL|L|M|S)(\d+)-(\d+)$/);
    if (compact) {
        const head = compact[1];
        const size = compact[2];
        const priceCents = parseInt(compact[3], 10) || 0;
        const tag = compact[4];
        let brand = head, bestLen = 0, type = '';
        for (let i = 0; i < SKU_BRANDS.length; i++) {
            if (head.startsWith(SKU_BRANDS[i]) && SKU_BRANDS[i].length <= head.length && SKU_BRANDS[i].length > bestLen) { brand = SKU_BRANDS[i]; bestLen = SKU_BRANDS[i].length; }
        }
        if (brand === head && legend.vendor) {
            const vendorCodes = Object.keys(legend.vendor);
            for (let i = 0; i < vendorCodes.length; i++) {
                const code = vendorCodes[i];
                if (head.startsWith(code) && code.length <= head.length && code.length > bestLen) { brand = code; bestLen = code.length; }
            }
        }
        if (brand !== head) type = head.slice(brand.length);
        r.vendorCode = brand;
        r.vendorLabel = (legend.vendor && (legend.vendor[brand] || legend.vendor[brand.toUpperCase()])) || brand;
        if (type) {
            const entry = legend.type && legend.type[type];
            r.typeCode = type;
            r.typeLabel = entry ? entry.label : type;
            r.category = entry ? entry.category : '';
            if (!entry) r.unknown.push('type:' + type);
        }
        r.sizeCode = size;
        r.sizeLabel = (legend.size && legend.size[size]) || size;
        if (!(legend.size && legend.size[size])) r.unknown.push('size:' + size);
        r.price = priceCents / 100;
        r.tag = tag;
        r.compact = true;
        return r;
    }
    // Legacy hyphenated format: Brand-Type-Size-Month-Price-Source-Tag#
    const parts = raw.split('-').map(function(p) { return p.trim(); });
    r.segments = parts;
    const b = parts[0];
    if (b) { r.vendorCode = b; r.vendorLabel = (legend.vendor && legend.vendor[b]) || b; if (!(legend.vendor && legend.vendor[b])) r.unknown.push('vendor:' + b); }
    const t = parts[1];
    if (t) {
        const entry = legend.type && legend.type[t];
        r.typeCode = t;
        r.typeLabel = entry ? entry.label : t;
        r.category = entry ? entry.category : '';
        if (!entry) r.unknown.push('type:' + t);
    }
    const s = parts[2];
    if (s) { r.sizeCode = s; r.sizeLabel = (legend.size && legend.size[s]) || s; if (!(legend.size && legend.size[s])) r.unknown.push('size:' + s); }
    const m = parts[3];
    if (m) { r.monthCode = m; r.monthName = SKU_MONTHS[m] || ''; if (!SKU_MONTHS[m]) r.unknown.push('month:' + m); }
    const p = parts[4];
    if (p) { r.price = parseFloat(String(p).replace(/[$,]/g, '')) || 0; }
    const src = parts[5];
    if (src) { r.sourceCode = src; r.sourceLabel = (legend.source && legend.source[src]) || src; if (!(legend.source && legend.source[src])) r.unknown.push('source:' + src); }
    if (parts[6] !== undefined) { r.tag = parts[6]; }
    return r;
}

// Spec-compliant parser: [Brand]-[Type]-[Size]-[Month]-[Cost]-[Vendor]-[PurchaseTag]
// Uses the editable legend (getSkuLegend) so codes can be added/adapted in the SKU Legend page.
function parseMulliganSKU(skuString) {
    if (!skuString || typeof skuString !== 'string') return { ok: false, error: 'No SKU provided.' };
    const raw = skuString.trim();
    const parts = raw.split('-').map(function(p) { return p.trim(); });
    if (parts.length === 7 || parts.length === 3) {
        const legend = getSkuLegend();
        function tr(map, code) {
            if (code === '' || code == null) return { code: code, label: '', category: '', found: false };
            const entry = map && (map[code] || map[String(code).toUpperCase()]);
            if (entry && typeof entry === 'object') return { code: code, label: entry.label, category: entry.category || '', found: true };
            if (entry && typeof entry === 'string') return { code: code, label: entry, found: true };
            return { code: code, label: code, found: false };
        }
        const brand = tr(legend.vendor, parts[0]);
        const type = tr(legend.type, parts[1]);
        const sizeLabel = (legend.size && legend.size[parts[2]]) || parts[2];
        const month = parts[3];
        const costRaw = parts[4];
        const cost = parseFloat(String(costRaw).replace(/[$,]/g, '')) || 0;
        const vendor = tr(legend.source, parts[5]);
        const purchaseTag = parts[6];
        const unknown = []
            .concat(parts.length === 3 ? (brand.found ? [] : ['brand:' + brand.code]) : (brand.found ? [] : ['brand:' + brand.code]))
            .concat(parts.length === 3 ? (type.found ? [] : ['type:' + type.code]) : (type.found ? [] : ['type:' + type.code]))
            .concat(parts.length === 3 ? [] : (vendor.found ? [] : ['vendor:' + vendor.code]));
        return {
            ok: true,
            raw: raw,
            brandLabel: brand.label, brandCode: brand.code,
            vendorLabel: vendor.label, vendorCode: vendor.code,
            typeLabel: type.label, typeCode: type.code,
            category: type.category || '',
            sizeLabel: sizeLabel, sizeCode: parts[2],
            monthCode: month,
            price: cost, cost: cost,
            sourceLabel: vendor.label, sourceCode: vendor.code,
            tag: purchaseTag, purchaseTag: purchaseTag,
            unknown: unknown
        };
    }
    return { ok: false, error: 'SKU needs 3 or 7 parts (Brand-Type-Size or Brand-Type-Size-Month-Cost-Vendor-Tag) separated by hyphens. Found ' + parts.length + '.' };
}

function applySmartSku() {
    const numEl = document.getElementById('m-num');
    if (!numEl) return;
    const raw = numEl.value.trim();
    if (!raw) return toast('Enter an Item # first');
    const m = parseMulliganSKU(raw);
    const p = (m && m.ok) ? m : parseSmartSku(raw);
    if (!p) { if (m && !m.ok) toast(m.error); return; }
    // Vendor match against the vendors dropdown (use legend name when available)
    const vendors = window._vendors || [];
    let vendorName = p.vendorLabel;
    const vEntry = (getSkuLegend().vendor || {})[p.vendorCode];
    if (vEntry && vEntry !== p.vendorLabel) vendorName = vEntry;
    let match = vendors.find(function(v) { return v.name && vendorName && (v.name.toLowerCase() === vendorName.toLowerCase() || v.name.toLowerCase().indexOf(vendorName.toLowerCase()) !== -1); });
    if (!match && p.vendorLabel) match = vendors.find(function(v) { return v.name && v.name.toLowerCase().indexOf(p.vendorLabel.toLowerCase()) !== -1; });
    if (match) { const sel = document.getElementById('m-vendor'); if (sel) sel.value = match.vendor_id; }
    // Title: "Brand Type - Size"
    const brand = (p.brandLabel || p.vendorLabel || '').trim();
    const type = (p.typeLabel || '').trim();
    const size = (p.sizeLabel || '').trim();
    let title = [brand, type].filter(Boolean).join(' ');
    if (size) title += (title ? ' - ' : '') + size;
    const titleEl = document.getElementById('m-title');
    if (titleEl) titleEl.value = title;
    // Category
    if (p.category) { const cat = document.getElementById('m-cat'); if (cat) cat.value = p.category; }
    // SKU numeric segment = Cost; Price = Cost with 70% margin, rounded to nearest dollar
    if (p.price) {
        const costEl = document.getElementById('m-cost');
        if (costEl) costEl.value = p.price.toFixed(2);
        const priceEl = document.getElementById('m-price');
        if (priceEl) {
            const price = Math.round(p.price / (1 - 0.70)); // 70% gross margin
            priceEl.value = price.toFixed(2);
        }
    }
    // Size / Source / Tag#
    if (document.getElementById('m-size') && p.sizeLabel) document.getElementById('m-size').value = p.sizeLabel;
    if (document.getElementById('m-source') && p.sourceLabel) document.getElementById('m-source').value = p.sourceLabel;
    if (document.getElementById('m-tagnum') && p.tag !== undefined) document.getElementById('m-tagnum').value = p.tag;
    // Date Acquired from month code
    if (p.monthCode && SKU_MONTHS[p.monthCode]) {
        const da = document.getElementById('m-date-acquired');
        if (da) da.value = new Date().getFullYear() + '-' + p.monthCode + '-01';
    }
    if (p.unknown.length) toast('Filled — unmapped codes: ' + p.unknown.join(', '));
    else toast('SKU decoded & form filled');
}

async function generateDescription() {
    const btn = document.getElementById('m-gen-desc');
    const descEl = document.getElementById('m-desc');
    if (!descEl) return;
    const val = function(id) { const el = document.getElementById(id); return el ? String(el.value || '').trim() : ''; };
    // Vendor/brand: read selected option text from the vendor dropdown
    let brand = '';
    const vendorSel = document.getElementById('m-vendor');
    if (vendorSel && vendorSel.selectedIndex >= 0) {
        const opt = vendorSel.options[vendorSel.selectedIndex];
        if (opt && opt.value) brand = (opt.text || '').trim();
    }
    const payload = {
        brand: brand,
        name: val('m-title'),
        type: val('m-title'),
        size: val('m-size'),
        category: val('m-cat'),
        condition: val('m-con'),
        price: val('m-price'),
        title: val('m-title')
    };
    const origText = btn ? btn.textContent : '';
    if (btn) { btn.disabled = true; btn.textContent = 'Generating…'; }
    try {
        const res = await fetch('/api/admin/generate-description', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + (localStorage.getItem('adminToken') || '') },
            body: JSON.stringify(payload)
        });
        let data = {};
        try { data = await res.json(); } catch (e) { data = {}; }
        if (res.ok && data && data.description && data.description.trim()) {
            descEl.value = data.description.trim();
            toast('Description generated');
        } else {
            toast('Could not generate description' + (data && data.error ? ': ' + data.error : ''));
        }
    } catch (e) {
        toast('Could not generate description');
    } finally {
        if (btn) { btn.disabled = false; btn.textContent = origText || '✨ Generate description'; }
    }
}

function onItemNumberInput() {
    if (window.editingItemNumber) return; // never auto-overwrite while editing
    const numEl = document.getElementById('m-num');
    if (!numEl) return;
    const raw = numEl.value.trim();
    if (!raw) return;
    const compactOk = /^[^-\s]+(2XL|XL|L|M|S)\d+-\d+$/.test(raw);
    const parts = raw.split('-');
    const hyphenOk = parts.length >= 5 && /^\d{2}$/.test(parts[3]) && !isNaN(parseFloat(parts[4]));
    const sevenOk = parts.length === 7;
    const shortOk = parts.length >= 3;
    if (compactOk || hyphenOk || sevenOk || shortOk) {
        applySmartSku();
    }
}

function renderLegend(el) {
    // Open immediately from the local cache/seed so the page never blocks on the
    // database or an expired session. Then sync from the DB in the background.

async function saveLegendEntry(e) {
    e.preventDefault();
    const legend = getSkuLegend();
    const origField = document.getElementById('leg-field-orig').value;
    const origCode = document.getElementById('leg-code-orig').value;
    const field = document.getElementById('leg-field').value;
    const code = document.getElementById('leg-code').value.trim().toUpperCase();
    const label = document.getElementById('leg-label').value.trim();
    const cat = document.getElementById('leg-cat').value;
    if (!field || !code || !label) return toast('Code and Maps To are required');
    if (origField && origCode && (origField !== field || origCode !== code)) {
        if (legend[origField]) delete legend[origField][origCode];
    }
    if (!legend[field]) legend[field] = {};
    if (field === 'type') legend.type[code] = { label: label, category: cat };
    else legend[field][code] = label;
    setSkuLegend(legend);
    try { await persistLegendToDb(legend); }
    catch (e) { toast('Save failed: ' + e.message + ' — please log in again.'); showLogin(); return; }
    closeModal();
    toast('Legend saved');
    showPage('legend');
}

async function deleteLegendEntry(field, code) {
    if (!confirm('Delete code "' + code + '"?')) return;
    const legend = getSkuLegend();
    if (legend[field]) delete legend[field][code];
    setSkuLegend(legend);
    try { await persistLegendToDb(legend); }
    catch (e) { toast('Delete failed: ' + e.message + ' — please log in again.'); showLogin(); return; }
    showPage('legend');
}

function escapeHtmlMsg(s) {
    return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

// Stronger escape used for all untrusted/DB-backed values injected into innerHTML.
// Escapes &, <, >, ", and ' to defeat attribute- and tag-breaking XSS.
function escapeHtml(s) {
    return String(s == null ? '' : s)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
}

// Escape a value for safe insertion into an HTML attribute (e.g. input value="").
function escapeAttr(s) {
    return escapeHtml(s);
}

function copySubscribers() {
    const emails = (window._subscribers || []).map(function(s) { return s.email; }).join(', ');
    if (!emails) return toast('No subscribers to copy');
    if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(emails).then(function() { toast('Copied ' + (window._subscribers || []).length + ' emails'); },
            function() { toast('Copy failed — try Export CSV'); });
    } else {
        toast('Clipboard not available — use Export CSV');
    }
}

function exportSubscribersCsv() {
    const subs = window._subscribers || [];
    if (!subs.length) return toast('No subscribers to export');
    let csv = 'email,joined,source\n';
    subs.forEach(function(s) {
        const email = '"' + String(s.email || '').replace(/"/g, '""') + '"';
        const joined = '"' + String(s.created_at || '').replace(/"/g, '""') + '"';
        const source = '"' + String(s.source || '').replace(/"/g, '""') + '"';
        csv += email + ',' + joined + ',' + source + '\n';
    });
    const blob = new Blob([csv], { type: 'text/csv' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'subscribers-' + new Date().toISOString().slice(0, 10) + '.csv';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
}
