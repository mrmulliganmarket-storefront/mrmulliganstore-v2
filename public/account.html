<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Account | Mulligan Market</title>
    <meta name="description" content="Manage your Mulligan Market account — view order history, manage your wishlist, and update your profile.">
    <link rel="canonical" href="https://www.mulliganmarket.com/account.html">
    <meta name="theme-color" content="#0f172a">
    <meta name="robots" content="noindex, nofollow">

    <!-- Open Graph -->
    <meta property="og:title" content="My Account | Mulligan Market">
    <meta property="og:description" content="Manage your Mulligan Market account — view order history, manage your wishlist, and update your profile.">
    <meta property="og:image" content="https://www.mulliganmarket.com/Mulligan_Market_hero.png">
    <meta property="og:url" content="https://www.mulliganmarket.com/account.html">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="MULLIGAN MARKET">

    <link rel="icon" href="MM_logo.jpg">
    <link rel="stylesheet" href="css/tailwind.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .font-anton { font-family: 'Poppins', sans-serif; letter-spacing: 0.05em; font-weight: 600; }
        html { scroll-behavior: smooth; }
    </style>
</head>
<body class="bg-[#E8DFC8]">
    <header class="bg-black text-white shadow-lg">
        <div class="container mx-auto px-4 py-4 flex justify-between items-center">
            <a href="/" class="font-anton text-5xl">MULLIGAN<span class="text-red-600">MARKET</span></a>
            <span class="text-red-600 font-bold text-sm">v8.2.1</span>
            <nav class="flex items-center gap-4">
                <a href="/#pro-shoppe" class="text-gray-300 hover:text-white transition">Store</a>
                <button onclick="logout()" class="text-gray-300 hover:text-red-600 transition text-sm font-bold">Logout</button>
            </nav>
        </div>
    </header>

    <main class="container mx-auto px-4 py-12">
        <div class="mb-8">
            <h1 class="font-anton text-4xl text-black"><span class="text-black">MY</span>&nbsp;<span class="text-red-600">ACCOUNT</span></h1>
            <p class="text-gray-600 text-sm mt-2">Manage your profile, orders, and wishlist.</p>
        </div>

        <div id="account-loading" class="text-center py-24">
            <div class="w-12 h-12 border-4 border-gray-300 border-t-red-600 rounded-full animate-spin mx-auto"></div>
            <p class="text-gray-500 font-bold mt-4">Loading account...</p>
        </div>

        <div id="account-content" class="hidden">
            <!-- Profile Section -->
            <div class="bg-white rounded-xl shadow p-6 mb-8">
                <h2 class="font-anton text-2xl text-black mb-4">Profile</h2>
                <form id="profile-form" onsubmit="return saveProfile(event)" class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-bold text-gray-600 mb-1">Full Name</label>
                        <input type="text" id="profile-name" class="w-full border border-gray-300 rounded-lg px-3 py-2 text-gray-800 focus:border-red-600 focus:outline-none">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-gray-600 mb-1">Email Address</label>
                        <input type="email" id="profile-email" readonly class="w-full border border-gray-300 rounded-lg px-3 py-2 text-gray-500 bg-gray-100">
                    </div>
                    <div class="md:col-span-2">
                        <label class="block text-xs font-bold text-gray-600 mb-1">Shipping Address</label>
                        <textarea id="profile-address" rows="2" class="w-full border border-gray-300 rounded-lg px-3 py-2 text-gray-800 focus:border-red-600 focus:outline-none" placeholder="123 Fairway Dr, Scottsdale, AZ 85251"></textarea>
                    </div>
                    <div class="flex items-end">
                        <button type="submit" id="profile-save-btn" class="bg-red-600 hover:bg-red-700 text-white font-bold px-6 py-2 rounded-full transition">Save Profile</button>
                    </div>
                    <div id="profile-msg" class="text-sm hidden"></div>
                </form>
            </div>

            <!-- Orders Section -->
            <div class="bg-white rounded-xl shadow p-6 mb-8">
                <div class="flex justify-between items-center mb-4">
                    <h2 class="font-anton text-2xl text-black">Order History</h2>
                </div>
                <div id="orders-list">
                    <div class="text-center py-8 text-gray-500">Loading orders...</div>
                </div>
            </div>

            <!-- Wishlist Section -->
            <div class="bg-white rounded-xl shadow p-6">
                <div class="flex justify-between items-center mb-4">
                    <h2 class="font-anton text-2xl text-black">My Wishlist</h2>
                </div>
                <div id="wishlist-list">
                    <div class="text-center py-8 text-gray-500">Loading wishlist...</div>
                </div>
            </div>
        </div>
    </main>

    <footer class="bg-gradient-to-b from-black to-gray-900 text-white pt-12 pb-8">
        <div class="container mx-auto px-4">
            <div class="border-t border-gray-800 pt-6 flex flex-col md:flex-row justify-between items-center text-xs text-gray-500 gap-4">
                <div>&copy; 2026 Mulligan Market. All rights reserved.</div>
                <div class="flex gap-4">
                    <span>Shipping: $8.35 for first item, $4.99 each additional</span>
                    <span>•</span>
                    <span>8.8% Tax</span>
                </div>
            </div>
        </div>
    </footer>

    <script>
        function getAuthToken() {
            return localStorage.getItem('mulliganAuthToken') || '';
        }

        function setAuthToken(token) {
            localStorage.setItem('mulliganAuthToken', token || '');
        }

        function clearAuthToken() {
            localStorage.removeItem('mulliganAuthToken');
        }

        function getCurrentCustomer() {
            try {
                var c = localStorage.getItem('mulliganCustomer');
                return c ? JSON.parse(c) : null;
            } catch(e) { return null; }
        }

        function setCurrentCustomer(c) {
            localStorage.setItem('mulliganCustomer', JSON.stringify(c || {}));
        }

        function clearCurrentCustomer() {
            localStorage.removeItem('mulliganCustomer');
        }

        function escapeHtml(s) {
            return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
        }

        function toast(msg) {
            var el = document.createElement('div');
            el.className = 'fixed bottom-6 left-1/2 -translate-x-1/2 bg-black text-white px-4 py-2 rounded-full shadow-lg text-sm z-[60]';
            el.textContent = msg;
            document.body.appendChild(el);
            setTimeout(function() { el.remove(); }, 2000);
        }

        function statusBadge(status) {
            var map = { Pending: 'bg-gray-200 text-gray-700', Processing: 'bg-yellow-100 text-yellow-800', Shipped: 'bg-blue-100 text-blue-800', Delivered: 'bg-green-100 text-green-800', Cancelled: 'bg-red-100 text-red-800' };
            var cls = map[status] || 'bg-gray-200 text-gray-700';
            return '<span class="inline-block px-2 py-0.5 rounded-full text-xs font-bold ' + cls + '">' + (status || 'Pending') + '</span>';
        }

        function imageApiUrl(itemNumber) {
            if (!itemNumber) return '';
            try {
                return new URL('/api/image?item=' + encodeURIComponent(itemNumber), window.location.origin).toString();
            } catch {
                return 'http://localhost:8787/api/image?item=' + encodeURIComponent(itemNumber);
            }
        }

        async function verifySession() {
            var token = getAuthToken();
            if (!token) {
                window.location.href = '/';
                return false;
            }
            try {
                var res = await fetch('/api/auth/me', { headers: { 'Authorization': 'Bearer ' + token } });
                if (!res.ok) {
                    clearAuthToken();
                    clearCurrentCustomer();
                    window.location.href = '/';
                    return false;
                }
                var data = await res.json();
                if (data.customer) {
                    setCurrentCustomer(data.customer);
                    return true;
                }
                return false;
            } catch (e) {
                window.location.href = '/';
                return false;
            }
        }

        function logout() {
            clearAuthToken();
            clearCurrentCustomer();
            window.location.href = '/';
        }

        async function loadOrders() {
            var token = getAuthToken();
            var container = document.getElementById('orders-list');
            if (!container) return;
            try {
                var res = await fetch('/api/customer/orders', { headers: { 'Authorization': 'Bearer ' + token } });
                if (!res.ok) throw new Error('Failed to load orders');
                var data = await res.json();
                var orders = data.orders || [];
                if (!orders.length) {
                    container.innerHTML = '<div class="text-center py-12 text-gray-500"><p>No orders yet.</p><p class="text-sm mt-2"><a href="/" class="text-red-600 hover:underline">Start shopping</a></p></div>';
                    return;
                }
                var html = '';
                orders.forEach(function(o) {
                    var od = typeof o.data === 'string' ? (function(){try{return JSON.parse(o.data);}catch(e){return {};}})() : (o.data || {});
                    var displayId = od.sku ? ('ORD-' + od.sku) : (od.item_number ? ('ORD-' + od.item_number) : (o.id || ''));
                    var items = Array.isArray(od.items) && od.items.length ? od.items : [];
                    var itemLines = items.map(function(it) {
                        var nm = it.name || '';
                        var num = it.item_number || '';
                        return '<li class="text-sm text-gray-700">' + escapeHtml(nm) + (nm && num ? ' <span class="text-gray-500 font-mono">(' + escapeHtml(num) + ')</span>' : (num ? '<span class="text-gray-500 font-mono">' + escapeHtml(num) + '</span>' : '')) + '</li>';
                    }).join('');
                    html += '<div class="border border-gray-200 rounded-xl p-4 mb-3">' +
                        '<div class="flex justify-between items-start gap-2">' +
                        '<div><p class="font-bold text-gray-800">#' + escapeHtml(displayId) + '</p>' + (od.customer_name ? '<p class="text-xs text-gray-500">' + escapeHtml(od.customer_name) + '</p>' : '') + '</div>' +
                        statusBadge(o.status) +
                        '</div>' +
                        (itemLines ? '<ul class="mt-2 list-disc pl-5">' + itemLines + '</ul>' : '') +
                        '<div class="flex justify-between items-center mt-2 text-sm"><span class="text-gray-500">Total</span><span class="font-bold text-gray-800">$' + (parseFloat(o.total || 0)).toFixed(2) + '</span></div>' +
                        (od.tracking ? '<p class="text-xs text-gray-500 mt-1">Tracking: ' + escapeHtml(od.tracking) + '</p>' : '') +
                        '<p class="text-xs text-gray-500 mt-1">Placed: ' + escapeHtml(o.created_at || '') + '</p>' +
                        '</div>';
                });
                container.innerHTML = html;
            } catch (err) {
                container.innerHTML = '<div class="text-center py-12 text-red-500"><p>Could not load orders.</p><p class="text-xs mt-2">' + escapeHtml(err.message || '') + '</p></div>';
            }
        }

        async function loadWishlist() {
            var token = getAuthToken();
            var container = document.getElementById('wishlist-list');
            if (!container) return;
            try {
                var res = await fetch('/api/customer/wishlist', { headers: { 'Authorization': 'Bearer ' + token } });
                if (!res.ok) throw new Error('Failed to load wishlist');
                var data = await res.json();
                var wishlist = data.wishlist || [];
                if (!wishlist.length) {
                    container.innerHTML = '<div class="text-center py-12 text-gray-500"><p>Your wishlist is empty.</p><p class="text-sm mt-2">Browse products and click the heart icon to save items.</p></div>';
                    return;
                }
                var html = '<table class="w-full text-sm"><thead><tr class="border-b border-gray-200"><th class="text-left pb-2 text-gray-600">Item</th><th class="text-right pb-2 text-gray-600">Price</th><th class="text-right pb-2"></th></tr></thead><tbody>';
                wishlist.forEach(function(i) {
                    var imgUrl = imageApiUrl(i.item_number || '');
                    var itemTitle = i.title || i.item_number || '';
                    html += '<tr class="border-t border-gray-100"><td class="py-2 truncate max-w-40">' +
                        '<div class="flex items-center gap-2">' +
                        '<img src="' + imgUrl + '" class="w-12 h-12 object-cover rounded" loading="lazy" onerror="this.style.display=\'none\'">' +
                        '<span class="font-medium text-gray-800">' + escapeHtml(itemTitle) + '</span>' +
                        '</div></td>' +
                        '<td class="text-right py-2 text-gray-800">$' + (parseFloat(i.price) || 0).toFixed(2) + '</td>' +
                        '<td class="text-right py-2"><button onclick="removeFromWishlist(\'' + escapeHtml(i.item_number || '') + '\')" class="text-xs text-gray-400 hover:text-red-600">Remove</button></td></tr>';
                });
                html += '</tbody></table>';
                container.innerHTML = html;
            } catch (err) {
                container.innerHTML = '<div class="text-center py-12 text-red-500"><p>Could not load wishlist.</p><p class="text-xs mt-2">' + escapeHtml(err.message || '') + '</p></div>';
            }
        }

        function removeFromWishlist(itemNumber) {
            var token = getAuthToken();
            var customer = getCurrentCustomer() || {};
            var wishlist = (customer.wishlist || []).filter(function(i) { return (i.item_number || '') !== itemNumber; });
            customer.wishlist = wishlist;
            setCurrentCustomer(customer);
            if (token) {
                fetch('/api/customer/wishlist', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
                    body: JSON.stringify({ wishlist: wishlist })
                }).then(function() { loadWishlist(); }).catch(function() { loadWishlist(); });
            } else {
                loadWishlist();
            }
        }

        async function saveProfile(e) {
            e.preventDefault();
            var nameEl = document.getElementById('profile-name');
            var addressEl = document.getElementById('profile-address');
            var msgEl = document.getElementById('profile-msg');
            var btn = document.getElementById('profile-save-btn');
            msgEl.classList.remove('hidden', 'text-green-400', 'text-red-400');
            msgEl.textContent = 'Saving...';
            btn.disabled = true;
            try {
                var res = await fetch('/api/customer/profile', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + getAuthToken() },
                    body: JSON.stringify({ name: nameEl.value.trim(), shipping_address: addressEl.value.trim() })
                });
                var data = await res.json();
                if (!res.ok || !data.ok) throw new Error(data.error || 'Save failed');
                var customer = getCurrentCustomer() || {};
                customer.name = nameEl.value.trim();
                customer.shipping_address = addressEl.value.trim();
                setCurrentCustomer(customer);
                msgEl.textContent = 'Profile saved!';
                msgEl.classList.add('text-green-400');
                setTimeout(function() { msgEl.classList.add('hidden'); }, 2000);
            } catch (err) {
                msgEl.textContent = err.message || 'Save failed';
                msgEl.classList.add('text-red-400');
            } finally {
                btn.disabled = false;
            }
            return false;
        }

        async function init() {
            var loading = document.getElementById('account-loading');
            var content = document.getElementById('account-content');
            var ok = await verifySession();
            if (!ok) return;
            if (loading) loading.classList.add('hidden');
            if (content) content.classList.remove('hidden');
            var customer = getCurrentCustomer();
            if (customer) {
                document.getElementById('profile-name').value = customer.name || '';
                document.getElementById('profile-email').value = customer.email || '';
                document.getElementById('profile-address').value = customer.shipping_address || '';
            }
            await Promise.all([loadOrders(), loadWishlist()]);
        }

        init();
    </script>
</body>
</html>
